  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

5<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin: 24px 0 0; font-weight: 400; font-size: clamp(40px, 6.6vw, 96px); line-height: 0.99; letter-spacing: -0.028em; padding-bottom: 0.06em;\" class=\"sn\">Amkor Technology<br>Financial Forecast Dashboard<\u002Fh1>\n      <div style=\"height: 1px; background: #17181A; opacity: 0.22; margin-top: 48px;\" class=\"sw\"><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 32px; padding-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #6E6B64;\" class=\"sa\">\n        <div>POWER BI · DAX · POWER QUERY<\u002Fdiv>\n        <div>PYTHON · SCIKIT-LEARN · STATSMODELS<\u002Fdiv>\n        <div>SARIMAX + REGULARIZED ENSEMBLE<\u002Fdiv>\n        <div>TEAM OF FIVE<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 34%); gap: clamp(30px, 5vw, 90px); align-items: end; padding: clamp(60px, 7vw, 96px) clamp(20px, 6.6vw, 96px) clamp(80px, 9vw, 120px);\">\n      <div style=\"display: flex; flex-direction: column; gap: 30px;\" class=\"sa\">\n        <div style=\"font-size: clamp(28px, 4vw, 54px); line-height: 1.13; letter-spacing: -0.015em; display: flex; flex-direction: column;\">\n          <span class=\"ln ln1\">Growth is easy to see.<\u002Fspan>\n          <span class=\"ln ln2\">Whether that growth pays for<\u002Fspan>\n          <span class=\"ln ln3\">the capital behind it is not.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: #A5A29B; max-width: 560px;\">Amkor is one of the largest outsourced assembly and test providers in the semiconductor supply chain. Its numbers live scattered across SEC filings, press releases and analyst reports, so answering a simple question about the business meant a week of manual collection. We replaced that with one Power BI report, and put a forecasting layer on top of it to answer the question the KPIs cannot.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"width: 100%; overflow: hidden; cursor: none;\" class=\"si\">\n        <img data-zoom=\"pbi1.jpg\" data-cap=\"CUSTOMER METRICS OVERVIEW\" src=\"72554369-dc3b-4ba1-9568-a377594028f9\" alt=\"Customer metrics overview page of the Power BI report\" style=\"width: 100%; height: auto; display: block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position: relative; isolation: isolate; background: #101114; color: #EDEAE4;\">\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid rgba(237,234,228,0.16); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8E8B84;\">\n        <span>THE FORECAST<\u002Fspan><span>DRAG ANYWHERE · 2015 Q3 → 2027 Q4<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 25%); gap: clamp(28px, 4vw, 64px); align-items: start; padding-top: 40px;\" class=\"sa\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-size: clamp(26px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.018em;\">{{ chartTitle }}<\u002Fdiv>\n          <div style=\"font-size: 17px; line-height: 1.65; color: #A5A29B; max-width: 640px;\">{{ chartSub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div sc-camel-on-click=\"{{ setSpread }}\" style=\"display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; cursor: none; background: {{ spreadBg }}; color: {{ spreadFg }}; border: 1px solid {{ spreadBd }};\"><span>ROIC − WACC SPREAD<\u002Fspan><s family=\"JetBrains Mono, monospace\" font-size=\"18\" fill=\"#8E8B84\" text-anchor=\"middle\">26Q4<\u002Ftext>\n                <text x=\"888\" y=\"396\" font-family=\"JetBrains Mono, monospace\" font-size=\"18\" fill=\"#8E8B84\" text-anchor=\"middle\">27Q1<\u002Ftext>\n                <text x=\"1024\" y=\"396\" font-family=\"JetBrains Mono, monospace\" font-size=\"18\" fill=\"#8E8B84\" text-anchor=\"middle\">27Q2<\u002Ftext>\n                <text x=\"1160\" y=\"396\" font-family=\"JetBrains Mono, monospace\" font-size=\"18\" fill=\"#8E8B84\" text-anchor=\"end\">27Q3<\u002Ftext>\n              <\u002Fg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isSpread }}\" hint-placeholder-val=\"{{ true }}\">\n              <path d=\"{{ bandPath }}\" fill=\"rgba(142,127,184,0.16)\"><\u002Fpath>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"9\">\n              <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"{{ b.w }}\" height=\"{{ b.h }}\" fill=\"{{ b.f }}\"><\u002Frect>\n            <\u002Fsc-for>\n            <path d=\"{{ actualPath }}\" stroke=\"#8E8B84\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n            <sc-if value=\"{{ isSpread }}\" hint-placeholder-val=\"{{ true }}\">\n              <path d=\"{{ pessPath }}\" stroke=\"#6E6B64\" stroke-width=\"1.5\" fill=\"none\" stroke-linejoin=\"round\" stroke-dasharray=\"4 4\"><\u002Fpath>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isSpread }}\" hint-placeholder-val=\"{{ true }}\">\n              <path d=\"{{ optPath }}\" stroke=\"#C9BEE4\" stroke-width=\"1.5\" fill=\"none\" stroke-linejoin=\"round\" stroke-dasharray=\"4 4\"><\u002Fpath>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isSpread }}\" hint-placeholder-val=\"{{ true }}\">\n              <path d=\"{{ basePath }}\" stroke=\"#8E7FB8\" stroke-width=\"2.6\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n            <\u002Fsc-if>\n            <path d=\"{{ scrubLine }}\" stroke=\"rgba(237,234,228,0.5)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"><\u002Fpath>\n            <circle cx=\"{{ scrubX }}\" cy=\"{{ scrubY }}\" r=\"5.5\" fill=\"#101114\" stroke=\"{{ scrubStroke }}\" stroke-width=\"2.4\"><\u002Fcircle>\n            <rect x=\"{{ handleX }}\" y=\"342\" width=\"26\" height=\"26\" rx=\"3\" fill=\"{{ handleFill }}\" stroke=\"#8E7FB8\" stroke-width=\"1.6\"><\u002Frect>\n            <path d=\"{{ handleGrip }}\" stroke=\"#EDEAE4\" stroke-width=\"1.2\" opacity=\"0.8\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 22px; border-top: 1px solid rgba(237,234,228,0.16); padding-top: 16px;\">\n            <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display: inline-flex; align-items: center; gap: 8px;\"><span style=\"display: inline-block; width: 16px; height: {{ l.h }}; background: {{ l.c }};\"><\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #8E8B84;\">{{ l.t }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid rgba(237,234,228,0.16); border-left: 1px solid rgba(237,234,228,0.16);\">\n          <div style=\"padding: 18px 22px; border-right: 1px solid rgba(237,234,228,0.16); border-bottom: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #8E8B84;\">{{ horizonLabel }}<\u002Fdiv>\n            <div style=\"font-size: 32px; line-height: 1.1; margin-top: 8px;\">{{ qLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ readouts }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 18px 22px; border-right: 1px solid rgba(237,234,228,0.16); border-bottom: 1px solid rgba(237,234,228,0.16); display: flex; flex-direction: column; gap: 8px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #8E8B84;\">{{ r.k }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; line-height: 1.1; color: {{ r.c }};\">{{ r.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.7; letter-spacing: 0.1em; color: #8E8B84;\">{{ note }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #6E6B64; padding-top: 22px;\">{{ provenance }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div data-r=\"split\" style=\"display: grid; grid-template-columns: minmax(0, 0.3fr) minmax(0, 1fr); gap: clamp(28px, 4.4vw, 80px); align-items: start;\" class=\"sa\">\n        <h2 style=\"margin: 0; font-weight: 400; font-size: clamp(30px, 4.1vw, 58px); line-height: 1.06; letter-spacing: -0.02em;\">What it showed<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">2023 — 2025<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 24px;\">Three straight years of destroying value<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">The spread ran positive through the 2021 and 2022 upcycle, peaking at plus 7.1, then fell through zero in 2023 and stayed under, bottoming at minus 7.2. Every quarter below the line is a quarter where the business earned less than the capital funding it cost.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">TEN QUARTERS<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 24px;\">The base case never recovers inside the horizon<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">The hybrid forecast climbs from minus 4.84 to minus 0.50 across ten quarters and never crosses zero. Only the optimistic path clears the line, in late 2027, and that path assumes the recovery runs a fifth faster than base. Drag the horizon above through all forty-one measured quarters and the ten forecast ones: the scenarios only separate once the climb accumulates.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">MODEL PICK<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 24px;\">Regularized beat boosted, and the blend beat neither<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">Lasso alone scored a test MAE of 0.7783. The shipped blend scored 1.1383. Boosting scored 4.1575 and was weighted to zero. With forty-one quarters of data, the flexible model had nothing to be flexible about — and the ensemble that was supposed to add robustness cost accuracy instead.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid rgba(237,234,228,0.16); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8E8B84;\">\n        <span>THE MODEL BENCH<\u002Fspan><span>DRAG THE WEIGHTS<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 30px; padding-top: 40px;\" class=\"sa\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 30%); gap: clamp(24px, 3vw, 56px); align-items: end;\">\n          <div style=\"font-size: clamp(26px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.018em; max-width: 720px;\">Four candidates, forty-one quarters. Only one earned its weight.<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #A5A29B;\">Every number here is read off the V15 notebook run. Drag a weight bar and the blend bound moves with it.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-r=\"split\" style=\"display: grid; grid-template-columns: minmax(240px, 0.85fr) minmax(280px, 1.15fr) minmax(300px, 1.3fr); gap: 0; border-top: 1px solid rgba(237,234,228,0.16); border-bottom: 1px solid rgba(237,234,228,0.16);\">\n\n          <div style=\"display: flex; flex-direction: column; gap: 16px; padding: 28px clamp(18px, 2.2vw, 34px) 32px 0;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #EDEAE4;\">FEATURES<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.6; color: #A5A29B;\">Twenty-seven columns entered. These fifteen ranked highest against the spread. Click one to read it.<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <sc-for list=\"{{ feats }}\" as=\"f\" hint-placeholder-count=\"15\">\n                <div sc-camel-on-click=\"{{ f.pick }}\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 44px 44px; gap: 10px; align-items: center; padding: 6px 8px; cursor: none; background: {{ f.bg }};\">\n                  <span style=\"font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; color: {{ f.fg }};\">{{ f.name }}<\u002Fspan>\n                  <span style=\"height: 8px; display: block; background: rgba(237,234,228,0.07);\">\n                    <span style=\"display: block; height: 8px; background: {{ f.bar }}; width: {{ f.bw }};\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right; color: {{ f.vc }};\">{{ f.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.8; letter-spacing: 0.08em; color: #6E6B64;\">PAIRS ABOVE |r| 0.80 WERE PRUNED BEFORE FITTING. SOX AGAINST AAPL SAT AT 0.982.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px clamp(18px, 2.2vw, 34px) 32px; border-left: 1px solid rgba(237,234,228,0.16); border-right: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #EDEAE4;\">CANDIDATES<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #8E8B84;\">TEST MAE<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ models }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 14px; border: 1px solid {{ m.bd }}; background: {{ m.bg }};\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\">\n                  <span style=\"font-size: 21px; color: {{ m.nc }};\">{{ m.name }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; color: {{ m.mc }};\">{{ m.mae }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.6; letter-spacing: 0.06em; color: #77736D;\">{{ m.hp }}<\u002Fdiv>\n                <div data-w=\"{{ m.id }}\" style=\"position: relative; height: 30px; background: rgba(237,234,228,0.06); cursor: none; user-select: none;\">\n                  <div style=\"position: absolute; left: 0; top: 0; bottom: 0; background: {{ m.fill }}; width: {{ m.pct }};\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 10px; top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #EDEAE4;\">WEIGHT<\u002Fdiv>\n                  <div style=\"position: absolute; right: 10px; top: 7px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #EDEAE4;\">{{ m.wt }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ resetWeights }}\" style=\"display: flex; flex-direction: column; gap: 4px; padding: 11px 14px; border: 1px solid rgba(237,234,228,0.26); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #EDEAE4; cursor: none;\"><span>RESET TO SHIPPED WEIGHTS<\u002Fspan><span style=\"color: #8E8B84;\">0.1 / 0.8 / 0.1 / 0<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 18px; padding: 28px 0 32px clamp(18px, 2.2vw, 34px);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #EDEAE4;\">OUTPUT<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #8E8B84;\">{{ blendLabel }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: clamp(38px, 4.6vw, 58px); line-height: 1; color: {{ blendColor }};\">{{ blendVal }}<\u002Fspan>\n              <span style=\"font-size: 15px; line-height: 1.6; color: #A5A29B;\">{{ blendNote }}<\u002Fspan>\n            <\u002Fdiv>\n            <svg width=\"100%\" sc-camel-view-box=\"0 0 560 300\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" fill=\"none\" style=\"display: block;\">\n              <path d=\"M 46 30 H 540\" stroke=\"rgba(237,234,228,0.08)\" stroke-width=\"1\"><\u002Fpath>\n              <path d=\"M 46 150 H 540\" stroke=\"rgba(237,234,228,0.34)\" stroke-width=\"1\"><\u002Fpath>\n              <path d=\"M 46 270 H 540\" stroke=\"rgba(237,234,228,0.08)\" stroke-width=\"1\"><\u002Fpath>\n              <text x=\"38\" y=\"35\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" fill=\"#8E8B84\" text-anchor=\"end\">+8<\u002Ftext>\n              <text x=\"38\" y=\"155\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" fill=\"#8E8B84\" text-anchor=\"end\">0<\u002Ftext>\n              <text x=\"38\" y=\"275\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" fill=\"#8E8B84\" text-anchor=\"end\">−8<\u002Ftext>\n              <path d=\"{{ envPath }}\" fill=\"rgba(142,127,184,0.18)\"><\u002Fpath>\n              <path d=\"{{ testPath }}\" stroke=\"#EDEAE4\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n              <sc-for list=\"{{ testDots }}\" as=\"d\" hint-placeholder-count=\"16\">\n                <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"2.6\" fill=\"#EDEAE4\"><\u002Fcircle>\n              <\u002Fsc-for>\n              <text x=\"46\" y=\"294\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#8E8B84\">2021 Q4<\u002Ftext>\n              <text x=\"540\" y=\"294\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#8E8B84\" text-anchor=\"end\">2025 Q3<\u002Ftext>\n            <\u002Fsvg>\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #6E6B64; line-height: 1.7;\">SIXTEEN-QUARTER TEST WINDOW. WHITE LINE IS THE MEASURED SPREAD. BAND IS ± THE CURRENT ERROR FIGURE.<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border-top: 1px solid rgba(237,234,228,0.16); border-left: 1px solid rgba(237,234,228,0.16);\">\n              <sc-for list=\"{{ metrics }}\" as=\"x\" hint-placeholder-count=\"6\">\n                <div style=\"padding: 12px 14px; border-right: 1px solid rgba(237,234,228,0.16); border-bottom: 1px solid rgba(237,234,228,0.16); display: flex; flex-direction: column; gap: 6px;\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #8E8B84;\">{{ x.k }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 19px; color: {{ x.c }};\">{{ x.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 3vw, 56px);\">\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #A5A29B;\">{{ benchNote }}<\u002Fp>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #A5A29B;\">Training error is the tell. On twenty-one training quarters the blend scored an R² of 0.9997 and a MAE of 0.0328 — it had memorised the window. The test set is where the honest number lives, and it is roughly thirty-five times larger.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.8; letter-spacing: 0.08em; color: #6E6B64;\">HYPERPARAMETERS, PER-MODEL TEST MAE AND ALL METRICS READ DIRECTLY FROM THE V15 SPREAD NOTEBOOK RUN. MIXING WEIGHTS REPORTS THE UPPER BOUND ON BLEND ERROR, THE WEIGHTED MEAN OF THE COMPONENT MAES — NOT A REFIT. THE ONE MEASURED BLEND IS THE SHIPPED 0.1 / 0.8 / 0.1 / 0 AT 1.1383.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div data-r=\"split\" style=\"display: grid; grid-template-columns: minmax(0, 0.3fr) minmax(0, 1fr); gap: clamp(28px, 4.4vw, 80px); align-items: start;\" class=\"sa\">\n        <h2 style=\"margin: 0; font-weight: 400; font-size: clamp(30px, 4.1vw, 58px); line-height: 1.06; letter-spacing: -0.02em;\">How it works<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">01<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 22px;\">Two targets, two panels<\u002Fdiv>\n              <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">The spread model runs on forty-one quarters, 2015 Q3 through 2025 Q3, with twenty-seven columns, split twenty-one train and sixteen test. The revenue model runs on forty quarters with twenty-eight. Both time-aware, both split after feature engineering so nothing leaks backwards.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">02<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 22px;\">Features chosen from the training window only<\u002Fdiv>\n              <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">Return on assets leads at 0.802 against the spread, then operating income at 0.542 and other manufacturing expenses at 0.480. Everything below the top five sits under 0.40, which is the real reason a small model won.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">03<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 22px;\">A weighted ensemble, then a hybrid<\u002Fdiv>\n              <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">Ridge, Lasso and ElasticNet weighted 0.1, 0.8 and 0.1, each alpha tuned by time-series cross-validation. Boosting was evaluated and dropped. SARIMAX carries the time structure the regressions cannot see, and the two are blended into the hybrid line you drag above.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr); gap: clamp(18px, 2.6vw, 48px); padding: 34px 0; border-top: 1px solid rgba(237,234,228,0.16); border-bottom: 1px solid rgba(237,234,228,0.16);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8E8B84;\">04<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 22px;\">What the scenarios are, honestly<\u002Fdiv>\n              <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; color: #A5A29B; max-width: 680px;\">All three scenarios start at the same place, minus 4.84 in 2025 Q3. What differs is the rate of climb out of it: optimistic runs the modelled recovery a fifth faster, pessimistic a fifth slower. They are not separately fitted models, and the page says so rather than dressing them up as three independent forecasts.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid rgba(237,234,228,0.16); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8E8B84;\">\n        <span>THE REPORT<\u002Fspan><span>CLICK A PAGE TO ENLARGE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(24px, 3vw, 44px); padding-top: 40px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\" class=\"sa\">\n          <div style=\"overflow: hidden; cursor: none;\"><img data-zoom=\"pbi1.jpg\" data-cap=\"CUSTOMER METRICS OVERVIEW\" src=\"72554369-dc3b-4ba1-9568-a377594028f9\" alt=\"Customer metrics overview\" style=\"width: 100%; height: auto; display: block;\"><\u002Fdiv>\n          <div style=\"font-size: 20px;\">Customer metrics overview<\u002Fdiv>\n          <div style=\"font-size: 16px; line-height: 1.65; color: #A5A29B;\">Market share, R&amp;D ratio to revenue, and revenue per PPE across AMKR, ASE, JCET and PTI.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\" class=\"sa\">\n          <div style=\"overflow: hidden; cursor: none;\"><img data-zoom=\"pbi4.jpg\" data-cap=\"PACKAGING AND TESTING GROWTH\" src=\"2336c347-514c-4357-bcc0-5faa72257f38\" alt=\"Packaging and testing growth\" style=\"width: 100%; height: auto; display: block;\"><\u002Fdiv>\n          <div style=\"font-size: 20px;\">Packaging and testing growth<\u002Fdiv>\n          <div style=\"font-size: 16px; line-height: 1.65; color: #A5A29B;\">Year over year growth by segment. AMKR at 20.0% packaging against ASE at 6.3% in 2025, out of a minus 19.7% trough in 2023.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\" class=\"sa\">\n          <div style=\"overflow: hidden; cursor: none;\"><img data-zoom=\"pbi2.jpg\" data-cap=\"OPERATIONAL PERFORMANCE\" src=\"f992476b-2428-4310-a976-1a4ee560cad0\" alt=\"Operational performance\" style=\"width: 100%; height: auto; display: block;\"><\u002Fdiv>\n          <div style=\"font-size: 20px;\">Operational performance<\u002Fdiv>\n          <div style=\"font-size: 16px; line-height: 1.65; color: #A5A29B;\">Asset turnover, revenue per PPE and inventory turnover, quarterly, all four companies.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\" class=\"sa\">\n          <div style=\"overflow: hidden; cursor: none;\"><img data-zoom=\"pbi3.jpg\" data-cap=\"TOP TEN REVENUE CONTRIBUTORS\" src=\"b461a63e-ea41-4e36-aae2-d4fb6e205735\" alt=\"Top ten revenue contributors\" style=\"width: 100%; height: auto; display: block;\"><\u002Fdiv>\n          <div style=\"font-size: 20px;\">Top ten revenue contributors<\u002Fdiv>\n          <div style=\"font-size: 16px; line-height: 1.65; color: #A5A29B;\">Concentration by customer, and how much of the book the largest accounts carry.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div data-r=\"split\" style=\"display: grid; grid-template-columns: minmax(0, 0.3fr) minmax(0, 1fr); gap: clamp(28px, 4.4vw, 80px); align-items: start;\" class=\"sa\">\n        <h2 style=\"margin: 0; font-weight: 400; font-size: clamp(30px, 4.1vw, 58px); line-height: 1.06; letter-spacing: -0.02em;\">What I'd do differently<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 22px; max-width: 700px; padding-top: 8px;\">\n          <p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: #A5A29B;\">Forty-one quarters is not much data, and I spent the first half of the project treating it like it was. The feature pruning and the time-aware split came late; if I ran it again they would come first, and the ensemble would have been three models from the start instead of four with one weighted to nothing.<\u002Fp>\n          <p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: #A5A29B;\">I would also separate the scenarios properly. Scaling one modelled recovery rate up and down by a fifth is a presentation device, not three forecasts, and it is the one part of this work I would not put in front of a CFO without the caveat attached.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(70px, 8vw, 110px) clamp(20px, 6.6vw, 96px) 0;\">\n      <div data-r=\"split\" style=\"display: grid; grid-template-columns: minmax(0, 0.3fr) minmax(0, 1fr); gap: clamp(28px, 4.4vw, 80px); align-items: start;\" class=\"sa\">\n        <h2 style=\"margin: 0; font-weight: 400; font-size: clamp(30px, 4.1vw, 58px); line-height: 1.06; letter-spacing: -0.02em;\">Stack<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #8E8B84; padding-bottom: 12px; border-bottom: 1px solid rgba(237,234,228,0.16);\">MODELLING<\u002Fdiv><div style=\"font-size: 17px; line-height: 1.95; color: #A5A29B;\">Python<br>scikit-learn<br>statsmodels (SARIMAX)<br>pandas<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #8E8B84; padding-bottom: 12px; border-bottom: 1px solid rgba(237,234,228,0.16);\">REPORTING<\u002Fdiv><div style=\"font-size: 17px; line-height: 1.95; color: #A5A29B;\">Power BI<br>DAX<br>Power Query<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #8E8B84; padding-bottom: 12px; border-bottom: 1px solid rgba(237,234,228,0.16);\">SOURCES<\u002Fdiv><div style=\"font-size: 17px; line-height: 1.95; color: #A5A29B;\">SEC filings<br>Press releases<br>Analyst reports<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: clamp(90px, 10vw, 150px) clamp(20px, 6.6vw, 96px) 0;\">\n      <a href=\"mic.html\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; border-top: 1px solid rgba(237,234,228,0.16); padding-top: 46px;\" class=\"sa\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; c the same die is not a thing anyone builds. Pick one and the verdict clears.'; }\n    else if (!ph('wire') && !ph('bumps')) { psVerdict = 'The die is floating.'; psNote = 'No bumps, no wires. Nothing carries a signal off the silicon.'; }\n    else if (!ph('balls')) { psVerdict = 'Nothing to solder down.'; psNote = 'The package is complete and cannot be attached to a board.'; }\n    else if (!ph('mould')) { psVerdict = 'Unencapsulated.'; psNote = 'Fine on a lab bench. It will not survive a reflow oven or a customer.'; }\n    else if (ph('bumps')) { psVerdict = 'Flip-chip, and it costs more.'; psNote = 'Five times the signal I/O of the wire-bond build, at roughly double the interconnect cost. That trade is the whole business \\u2014 and the reason the spread above is so sensitive to which packages Amkor is actually shipping.'; }\n    else { psVerdict = 'Legacy, and cheap.'; psNote = 'The lowest cost index you can build here. It also caps out around a hundred and eighty signals, which is why the industry left it behind for anything that computes.'; }\n\n\n\n    return {\n      isSpread: spread, isRevenue: !spread, bars, legend, readouts, qLabel,\n      horizonLabel: hist ? 'HISTORY' : 'HORIZON',\n      actualPath, basePath, optPath, pessPath, bandPath,\n      scrubLine: 'M ' + px(q).toFixed(1) + ' ' + Y0 + ' V ' + Y1,\n      scrubX: px(q).toFixed(1), scrubY: py(sv).toFixed(1),\n      scrubStroke: hist ? '#EDEAE4' : (spread ? '#8E7FB8' : '#C9BEE4'),\n      handleX: (px(q) - 13).toFixed(1), handleFill: this.dragging ? '#8E7FB8' : 'rgba(142,127,184,0.35)',\n      handleGrip: 'M ' + (px(q) - 4).toFixed(1) + ' 350 V 360 M ' + px(q).toFixed(1) + ' 350 V 360 M ' + (px(q) + 4).toFixed(1) + ' 350 V 360',\n      chartTitle: spread ? 'ROIC minus WACC, forty-one measured quarters and a ten quarter forecast' : 'Forecast quarterly revenue, 2025 Q3 to 2027 Q3',\n      chartSub: spread\n        ? 'Above zero the business earns more than its capital costs. Below zero it destroys value.
