  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

d\"><path d=\"M13 8H3\"><\u002Fpath><path d=\"M7 4L3 8l4 4\"><\u002Fpath><\u002Fsvg><span>Quinn Yen<\u002Fspan><\u002Fa>\n      <div style=\"display: flex; align-items: center; gap: 30px;\">\n        <a href=\"amkor.html\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px solid transparent; text-decoration: none;\" style-hover=\"border-bottom-color: #CF9BFF;\"><span style=\"display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #CF9BFF; opacity: 0.6;\"><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7F94A1;\">01<\u002Fspan><span style=\"font-size: 14px; font-weight: 400; color: #93A7B2;\">Amkor<\u002Fspan><\u002Fa><a href=\"mic.html\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px solid transparent; text-decoration: none;\" style-hover=\"border-bottom-color: #DA4339;\"><span style=\"display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #DA4339; opacity: 0.6;\"><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7F94A1;\">02<\u002Fspan><span style=\"font-size: 14px; font-weight: 400; color: #93A7B2;\">MIC<\u002Fspan><\u002Fa><span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px solid #2BB3E0;\"><span style=\"display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2BB3E0; opacity: 1;\"><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #2BB3E0;\">03<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; color: #E4EDF2;\">UIS<\u002Fspan><\u002Fspan>\n        <span style=\"width: 1px; height: 20px; background: rgba(228,237,242,0.12);\"><\u002Fspan>\n        <a href=\"Quinn-Yen-Resume.pdf\" target=\"_blank\" rel=\"noopener\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #93A7B2; text-decoration: none;\" style-hover=\"color: #2BB3E0;\">Résumé<\u002Fa>\n        <a href=\"mailto:kuenyuye@asu.edu\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 22px; background: #2BB3E0; color: #08131A; font-size: 14px; font-weight: 600; text-decoration: none;\">Get in touch<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n  <!-- HERO -->\n  <div style=\"position: relative; padding: clamp(20px, 6.6vw, 110px) clamp(20px, 6.6vw, 110px) 0; min-height: 720px;\" data-r=\"hero\">\n\n    <div style=\"position: absolute; right: 0px; top: 60px; left: max(640px, 50%); height: 620px; z-index: 4;\" data-r=\"art\">\n      <canvas id=\"tangle\" width=\"1480\" height=\"1240\" style=\"width: 100%; height: 620px; display: block;\"><\u002Fcanvas>\n    <\u002Fdiv>\n\n    <div style=\"position: relative; z-index: 10; max-width: 560px;\">\n      <div class=\"up\" style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 30px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #2BB3E0;\">DIE 03<\u002Fdiv>\n        <div style=\"width: 46px; height: 1px; background: rgba(228,237,242,0.22);\"><\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #7F94A1;\">UNITED INTEGRATED SERVICES<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 class=\"up\" style=\"margin: 0 0 26px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 5.6vw, 74px); line-height: 1.03; letter-spacing: -0.015em;\"><span style=\"color: #2BB3E0;\">UIS<\u002Fspan> Fire Protection Dashboard<\u002Fh1>\n      <p class=\"up2\" style=\"margin: 0 0 38px; font-size: 19px; line-height: 1.65; color: #93A7B2; max-width: 545px;\">Material flow and budget control for the fire protection scope of a semiconductor fab build — fire alarm, VESDA aspirating smoke detection, extinguishers and the BDA system. Built to answer one question management kept asking and nobody could answer: what have we actually got, and what has to be ordered next.<\u002Fp>\n      <div class=\"up2\" style=\"display: flex; flex-wrap: wrap; gap: 34px; padding-top: 26px; border-top: 1px solid rgba(228,237,242,0.12);\">\n        <div style=\"display: flex; flex-direction: column; gap: 7px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">ROLE<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Assistant Engineer / Project Coordinator<br>Fire Protection Materials &amp; Logistics<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 7px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">WHERE<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">United Integrated Services (USA)<br>Semiconductor fab construction<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 7px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">SCOPE<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Fire alarm and VESDA systems<br>Extinguishers and BDA system<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 7px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">BUILT WITH<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Power BI<br>DAX and Power Query<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- METRICS -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; margin-top: 66px; border-top: 1px solid rgba(228,237,242,0.12); border-bottom: 1px solid rgba(228,237,242,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: 'JetBrains Mono', monospace;\">\n    <div style=\"padding: 26px 28px 26px clamp(20px, 6.6vw, 110px);\"><div style=\"font-size: 34px; color: #E4EDF2;\">570<\u002Fdiv><div style=\"font-size: 10px; letter-spacing: 0.14em; color: #7F94A1; margin-top: 9px;\">ITEMS IN THE CATALOGUE<\u002Fdiv><\u002Fdiv><div style=\"padding: 26px 26px 28px; border-left: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-size: 34px; color: #E4EDF2;\">1M<\u002Fdiv><div style=\"font-size: 10px; letter-spacing: 0.14em; color: #7F94A1; margin-top: 9px;\">UNITS MOVED, JAN–AUG 2026<\u002Fdiv><\u002Fdiv><div style=\"padding: 26px 26px 28px; border-left: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-size: 34px; color: #2BB3E0;\">26<\u002Fdiv><div style=\"font-size: 10px; letter-spacing: 0.14em; color: #7F94A1; margin-top: 9px;\">ITEMS AT ZERO WITH LIVE DEMAND<\u002Fdiv><\u002Fdiv><div style=\"padding: 26px clamp(20px, 6.6vw, 110px) 28px 28px; border-left: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-size: 34px; color: #2BB3E0;\">29%<\u002Fdiv><div style=\"font-size: 10px; letter-spacing: 0.14em; color: #7F94A1; margin-top: 9px;\">OF ITEMS CARRY A UNIT COST<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PROBLEM -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; padding: 76px clamp(20px, 6.6vw, 110px) 0;\">\n    <div data-r=\"split\" style=\"display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 60px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">The problem<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 700px;\">\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.7;\">UIS already has a mature material process. Requisition, purchase order, delivery, receipt, issue to site — the steps exist and people follow them. The weak point is the record. On-hand quantities coming back from the warehouse side are unreliable, so the process runs correctly on numbers that are wrong.<\u002Fp>\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: #93A7B2;\">That is a different problem from the one I had solved before, where there was no system at all. Here the fix is not another app. I pulled the item master and the transaction history out of the system and treated it as a data question: what actually moves, what has never moved, what is about to run out, and how much of the spend the numbers can even account for.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- THE LINE -->\n  <div class=\"rvl\" style=\"position: relative; z-index: 10; padding: 80px clamp(20px, 6.6vw, 110px) 0;\">\n    <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; padding-bottom: 30px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">The line<\u002Fdiv>\n        <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.1;\">What actually deserves to be stocked?<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #93A7B2; max-width: 700px;\">All 570 items ranked by how much of each one moved in eight months — bars are units consumed, the pale line is the running share of total consumption. Drag the cutoff left or right. Everything left of it earns a reorder point and safety stock; everything right of it gets bought against a drawing when the job needs it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;\">\n        <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ p.go }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.13em; padding: 10px 16px; cursor: none; text-align: right; background: {{ p.bg }}; color: {{ p.fg }}; border: 1px solid {{ p.bd }};\">{{ p.t }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"curve\" sc-camel-on-mouse-down=\"{{ curveDown }}\" style=\"position: relative; cursor: none; user-select: none; border-top: 1px solid rgba(228,237,242,0.12); border-bottom: 1px solid rgba(228,237,242,0.12); padding: 22px 0 14px;\">\n      <canvas id=\"curveCv\" width=\"2440\" height=\"860\" style=\"width: 100%; height: 430px; display: block;\"><\u002Fcanvas>\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7F94A1; padding-top: 8px;\">\n        <span>BARS · UNITS CONSUMED PER ITEM<\u002Fspan>\n        <span style=\"color: #8FE3F7;\">{{ cutLabel }}<\u002Fspan>\n        <span>DRAG THE CUTOFF LEFT OR RIGHT<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-r=\"cols\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; padding-top: 34px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 20px; border-top: 2px solid #2BB3E0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #2BB3E0;\">STOCK · HOLD ON THE SHELF<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 40px; color: #E4EDF2; line-height: 1;\">{{ cKeep }}<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.7; color: #93A7B2;\">items with a reorder point and safety stock. Together they cover <span style=\"color: #8FE3F7;\">{{ cCover }}<\u002Fspan> of everything the site consumed in eight months.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 20px; border-top: 2px solid rgba(228,237,242,0.18);\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #7F94A1;\">BUY TO JOB · ORDER WHEN NEEDED<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 40px; color: #E4EDF2; line-height: 1;\">{{ cDrop }}<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.7; color: #93A7B2;\"><span style=\"color: #E4EDF2;\">{{ cDead }}<\u002Fspan> of them did not move once. Holding them ties up <span style=\"color: #8FE3F7;\">{{ cCapital }}<\u002Fspan> of capital, on mock unit costs.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 20px; border-top: 2px solid {{ cVerdictBd }};\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: {{ cVerdictFg }};\">{{ cVerdictTag }}<\u002Fdiv>\n        <div style=\"font-size: 17px; line-height: 1.6; color: #E4EDF2;\">{{ cVerdict }}<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.7; color: #7F94A1;\">{{ cVerdictSub }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PAGES -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; padding: 70px clamp(20px, 6.6vw, 110px) 0;\">\n    <div data-r=\"split\" style=\"display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 60px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">Four views<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\"><div style=\"display: grid; grid-template-columns: minmax(0, 178px) minmax(0, 1fr); gap: 24px; align-items: start; padding: 24px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 17px; font-weight: 600; color: #2BB3E0;\">Overview<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #7F94A1;\">Is the picture healthy<\u002Fdiv><\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Catalogue size, total movement, inventory value and the count of items that need attention today, with a monthly consumption line and a family breakdown underneath. The page a manager opens first.<\u002Fp><\u002Fdiv><div style=\"display: grid; grid-template-columns: minmax(0, 178px) minmax(0, 1fr); gap: 24px; align-items: start; padding: 24px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 17px; font-weight: 600; color: #2BB3E0;\">Stockout risk<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #7F94A1;\">What runs out next<\u002Fdiv><\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Every item ranked by risk score, with net position, days of cover and reorder point side by side, filterable by family, tier and criticality. This is the ordering list.<\u002Fp><\u002Fdiv><div style=\"display: grid; grid-template-columns: minmax(0, 178px) minmax(0, 1fr); gap: 24px; align-items: start; padding: 24px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 17px; font-weight: 600; color: #2BB3E0;\">Demand patterns<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #7F94A1;\">What is worth stocking<\u002Fdiv><\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Demand rate against variability, the catalogue split into movement tiers, and a Pareto curve showing how few items carry most of the volume. Separates the items that deserve a reorder point from the rest.<\u002Fp><\u002Fdiv><div style=\"display: grid; grid-template-columns: minmax(0, 178px) minmax(0, 1fr); gap: 24px; align-items: start; padding: 24px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 17px; font-weight: 600; color: #2BB3E0;\">Value and budget<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #7F94A1;\">Where the money actually is<\u002Fdiv><\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Inventory value against quantity on hand, the items with no unit cost, and how much demand that leaves unpriced. The page that says how far the spend reporting can be trusted.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LIVE STOCKOUT RISK -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; padding: 80px clamp(20px, 6.6vw, 110px) 0;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 26px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">The ordering list · live<\u002Fdiv>\n        <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.1;\">What runs out next, sorted and filtered in the browser.<\u002Fdiv>\n        <div style=\"align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; letter-spacing: 0.08em; color: #08131A; background: #F2C744; padding: 7px 14px; font-weight: 500;\">* MOCK DATA SHOWN — REBUILT WITH SAMPLE FIGURES FOR CONFIDENTIALITY<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ resetRisk }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1; border: 1px solid rgba(228,237,242,0.2); padding: 9px 16px; cursor: none; flex-shrink: 0;\" style-hover=\"color: #E4EDF2; border-color: #2BB3E0;\">RESET FILTERS<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-r=\"cols\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid rgba(228,237,242,0.16); border-bottom: 0;\">\n      <div style=\"padding: 22px 24px; border-right: 1px solid rgba(228,237,242,0.16); display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">ITEMS BELOW ROP<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1; color: #E0873A;\">{{ kBelow }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 22px 24px; border-right: 1px solid rgba(228,237,242,0.16); display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">CRITICAL OUT OF STOCK<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1; color: #E85A4F;\">{{ kOut }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 22px 24px; border-right: 1px solid rgba(228,237,242,0.16); display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">NEGATIVE POSITION<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1; color: #E4EDF2;\">{{ kNeg }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 22px 24px; display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">INVENTORY VALUE<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1; color: #E4EDF2;\">{{ kValue }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border: 1px solid rgba(228,237,242,0.16); background: rgba(12,27,36,0.6); padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 26px 40px; align-items: center;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">FAMILY<\u002Fspan>\n        <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n          <sc-for list=\"{{ famChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; padding: 7px 13px; cursor: none; background: {{ c.bg }}; color: {{ c.fg }}; border: 1px solid {{ c.bd }};\">{{ c.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">TIER<\u002Fspan>\n        <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n          <sc-for list=\"{{ tierChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; padding: 7px 13px; cursor: none; background: {{ c.bg }}; color: {{ c.fg }}; border: 1px solid {{ c.bd }};\">{{ c.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7F94A1;\">CRITICALITY<\u002Fspan>\n        <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n          <sc-for list=\"{{ critChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; padding: 7px 13px; cursor: none; background: {{ c.bg }}; color: {{ c.fg }}; border: 1px solid {{ c.bd }};\">{{ c.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #2BB3E0; margin-left: auto;\">{{ kShown }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border: 1px solid rgba(228,237,242,0.16); border-top: 0; overflow-x: auto;\">\n      <div style=\"min-width: 860px;\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 66px 62px 158px 58px 104px 70px; gap: 14px; padding: 14px 24px; border-bottom: 1px solid rgba(228,237,242,0.16); background: rgba(228,237,242,0.04);\">\n          <sc-for list=\"{{ riskCols }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; cursor: none; color: {{ c.fg }};\">{{ c.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"max-height: 460px; overflow-y: auto;\">\n          <sc-for list=\"{{ riskRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 66px 62px 158px 58px 104px 70px; gap: 14px; padding: 11px 24px; border-bottom: 1px solid rgba(228,237,242,0.07); align-items: center;\" style-hover=\"background: rgba(43,179,224,0.07);\">\n              <div style=\"font-size: 13.5px; color: #E4EDF2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.id }}<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #93A7B2;\">{{ r.fam }}<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{ r.netFg }};\">{{ r.netTxt }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 10px;\">\n                <span style=\"flex: 1; height: 7px; background: rgba(228,237,242,0.08); display: block;\"><span style=\"display: block; height: 7px; width: {{ r.barW }}; background: {{ r.barBg }};\"><\u002Fspan><\u002Fspan>\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #93A7B2; width: 46px; text-align: right;\">{{ r.coverTxt }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #93A7B2;\">{{ r.ropTxt }}<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ r.statusFg }};\">{{ r.statusTxt }}<\u002Fdiv>\n              <div><span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 3px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; background: {{ r.riskBg }}; color: {{ r.riskFg }};\">{{ r.riskTxt }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px 26px; padding-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7F94A1;\">\n      <span>CLICK A COLUMN HEADING TO SORT<\u002Fspan>\n      <span>RISK SCORE 1–15, COMPOSITE OF COVER, CRITICALITY AND PICK FREQUENCY<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SCREENS -->\n  <div class=\"rvr\" style=\"position: relative; z-index: 10; padding: 76px clamp(20px, 6.6vw, 110px) 0;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n        <div style=\"font-size: 21px; font-weight: 600;\">The report<\u002Fdiv>\n        <div style=\"align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; letter-spacing: 0.08em; color: #08131A; background: #F2C744; padding: 7px 14px; font-weight: 500;\">* MOCK DATA SHOWN — REBUILT WITH SAMPLE FIGURES FOR CONFIDENTIALITY<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7F94A1;\">POWER BI · SAMPLE DATA · CLICK A SCREEN TO ENLARGE<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"cols\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;\"><div style=\"display: flex; flex-direction: column; gap: 12px;\"><div data-zoom=\"uis1.jpg\" data-cap=\"OVERVIEW\" style=\"border: 1px solid rgba(228,237,242,0.22); overflow: hidden; background: #0C1B24; cursor: none;\"><img src=\"511d67d8-429a-45be-ac5a-18299cd82638\" alt=\"Overview\" style=\"width: 100%; display: block;\"><\u002Fdiv><div style=\"font-size: 16px; font-weight: 600;\">Overview<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Catalogue, movement, value and the items needing attention, in one screen.<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 12px;\"><div data-zoom=\"uis2.jpg\" data-cap=\"STOCKOUT RISK\" style=\"border: 1px solid rgba(228,237,242,0.22); overflow: hidden; background: #0C1B24; cursor: none;\"><img src=\"87318d07-2f04-4029-b8cf-75442598bb2a\" alt=\"Stockout risk\" style=\"width: 100%; display: block;\"><\u002Fdiv><div style=\"font-size: 16px; font-weight: 600;\">Stockout risk<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Ranked by risk score, with days of cover and reorder point on the same row.<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 12px;\"><div data-zoom=\"uis3.jpg\" data-cap=\"DEMAND PATTERNS\" style=\"border: 1px solid rgba(228,237,242,0.22); overflow: hidden; background: #0C1B24; cursor: none;\"><img src=\"002f2281-eee7-469f-a2e8-4cfe917c5bf4\" alt=\"Demand patterns\" style=\"width: 100%; display: block;\"><\u002Fdiv><div style=\"font-size: 16px; font-weight: 600;\">Demand patterns<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Rate against variability, movement tiers, and the Pareto curve.<\u002Fdiv><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 12px;\"><div data-zoom=\"uis4.jpg\" data-cap=\"VALUE AND BUDGET\" style=\"border: 1px solid rgba(228,237,242,0.22); overflow: hidden; background: #0C1B24; cursor: none;\"><img src=\"2933bb0c-b967-49fa-bfbd-25996ff097f2\" alt=\"Value and budget\" style=\"width: 100%; display: block;\"><\u002Fdiv><div style=\"font-size: 16px; font-weight: 600;\">Value and budget<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.6; color: #93A7B2;\">Value against quantity, and the size of the missing-cost problem.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FINDINGS -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; padding: 78px clamp(20px, 6.6vw, 110px) 0;\">\n    <div data-r=\"split\" style=\"display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 60px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">What it found<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\"><div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 26px; align-items: start; padding: 26px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #2BB3E0; padding-top: 5px;\">01<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 700px;\"><div style=\"font-size: 19px; font-weight: 600; color: #E4EDF2;\">Half the catalogue has never moved<\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">289 of 570 items — 50.7 percent — recorded no movement at all in eight months, and only 8 items move frequently. That is not a stock problem, it is a buying problem: material was ordered to a drawing rather than to consumption, and it is now sitting in a rack.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 26px; align-items: start; padding: 26px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #2BB3E0; padding-top: 5px;\">02<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 700px;\"><div style=\"font-size: 19px; font-weight: 600; color: #E4EDF2;\">The movement that matters is tiny<\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">The top thirty items carry the large majority of all consumption, and the curve flattens almost immediately after them. Those are the only items that justify a reorder point and safety stock. Everything else should be bought to the job, not held.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 26px; align-items: start; padding: 26px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #2BB3E0; padding-top: 5px;\">03<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 700px;\"><div style=\"font-size: 19px; font-weight: 600; color: #E4EDF2;\">The spend reporting cannot see most of the spend<\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Only 29 percent of items carry a unit cost. 404 items have none, which leaves roughly 875 thousand units of demand with no price attached. Until the cost master is filled in, budget by scope is directional at best — and that is the single highest-value fix available here.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 26px; align-items: start; padding: 26px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #2BB3E0; padding-top: 5px;\">04<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 700px;\"><div style=\"font-size: 19px; font-weight: 600; color: #E4EDF2;\">Value and volume are two different problems<\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Six units of one control panel hold as much inventory value as six thousand conduit fittings. Count accuracy earns its keep where the dollars are; availability earns its keep where the volume is. Treating both with one policy is how a warehouse ends up wrong in both directions.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 26px; align-items: start; padding: 26px 0; border-top: 1px solid rgba(228,237,242,0.12);\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #2BB3E0; padding-top: 5px;\">05<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 700px;\"><div style=\"font-size: 19px; font-weight: 600; color: #E4EDF2;\">The urgent list is short and specific<\u002Fdiv><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">26 items sit at zero on hand while still being picked, and 38 sit below their reorder point. That is a list a buyer can act on this week, which is the difference between an analysis and a tool.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HONESTY -->\n  <div class=\"rvl\" style=\"position: relative; z-index: 10; padding: 66px clamp(20px, 6.6vw, 110px) 0;\">\n    <div style=\"border-left: 2px solid #2BB3E0; padding: 4px 0 4px 26px; max-width: 780px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #2BB3E0; margin-bottom: 12px;\">WHAT THIS IS NOT<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #93A7B2;\">Lead times in the risk model are working assumptions, not figures confirmed with procurement, and that caveat is printed on the report itself rather than buried. Reorder points are calculated from eight months of history, which is short. The figures shown here are sample data. The point of the dashboard is to make the gaps visible, not to pretend they are closed.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- STACK -->\n  <div class=\"rv\" style=\"position: relative; z-index: 10; padding: 66px clamp(20px, 6.6vw, 110px) 0;\">\n    <div data-r=\"split\" style=\"display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 60px; border-top: 1px solid rgba(228,237,242,0.12); padding-top: 40px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #2BB3E0;\">How it is built<\u002Fdiv>\n      <div data-r=\"cols\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"font-size: 13px; color: #7F94A1;\">Model<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.85; color: #93A7B2;\">Star schema<br>Dim_Item · Dim_Date<br>Dedicated measure table<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"font-size: 13px; color: #7F94A1;\">Logic<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.85; color: #93A7B2;\">DAX measures<br>Days cover · ROP · risk score<br>Demand CV and tiering<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"font-size: 13px; color: #7F94A1;\">Sources<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.85; color: #93A7B2;\">Item master export<br>Transaction history<br>Power Query cleanup<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NEXT -->\n  <div class=\"rvr\" style=\"position: relative; z-index: 10; padding: 76px clamp(20px, 6.6vw, 110px) 60px;\">\n    <div style=\"border: 1px solid rgba(228,237,242,0.12); padding: 34px 36px; display: flex; align-items: center; justify-content: space-between; gap: 32px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #7F94A1;\">DIE 01<\u002Fdiv>\n        <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1.15;\">Amkor capstone project<\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border: 1px solid #CF9BFF; color: #CF9BFF; font-size: 15px; font-weight: 600; flex-shrink: 0;\">\n        <span>Open<\u002Fspan>\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#CF9BFF\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8h10\"><\u002Fpath><path d=\"M9 4l4 4-4 4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4300}}\">\nconst RANDOM = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };\nconst MOVERS = 281, TOTAL = 570, DEAD = TOTAL - MOVERS;\nconst DATA = (() => {\n  const rnd = RANDOM(20260910);\n  const raw = [];\n  for (let i = 0; i < TOTAL; i++) raw.push(i < MOVERS ? Math.pow(i + 1, -1.25) * (0.72 + rnd() * 0.56) : 0);\n  const sorted = raw.slice(0, MOVERS).sort((a, b) => b - a).concat(new Array(DEAD).fill(0));\n  const rawSum = sorted.reduce((a, b) => a + b, 0);\n  const move = sorted.map((r) => Math.max(r > 0 ? 1 : 0, Math.round(r / rawSum * 1000000)));\n  const cost = [], hold = [];\n  for (let i = 0; i < TOTAL; i++) {\n    cost.push(Math.round((2 + Math.pow(rnd(), 2.6) * 100) * 100) / 100);\n    hold.push(move[i] > 0 ? Math.min(50, Math.round(move[i] * (0.04 + rnd() * 0.18)) + 1) : 1 + Math.round(rnd() * 16));\n  }\n  const total = move.reduce((a, b) => a + b, 0);\n  const cum = []; let run = 0;\n  for (let i = 0; i < TOTAL; i++) { run += move[i]; cum.push(run); }\n  const value = move.map((m, i) => hold[i] * cost[i]);\n  const cumValue = []; let rv = 0;\n  for (let i = TOTAL - 1; i >= 0; i--) { rv += value[i]; cumValue[i] = rv; }\n  return { move: move, total: total, cum: cum, cumValue: cumValue, max: move[0] };\n})();\nconst MONEY = (n) => n >= 1000000 ? '$' + (n / 1000000).toFixed(2) + 'M' : (n >= 1000 ? '$' + Math.round(n / 1000) + 'K' : '$' + Math.round(n));\n\nconst CW = 1220, CH = 430;\nconst PADL = 66, PADR = 74, PADT = 34, PADB = 46;\nconst PW = CW - PADL - PADR, PH = CH - PADT - PADB, BASE = PADT + PH;\nconst CX = (i) => PADL + (i / (TOTAL - 1)) * PW;\nconst XRANK = (x) => Math.round((x - PADL) / PW * (TOTAL - 1)) + 1;\nconst UNITS = (n) => n >= 10000 ? Math.round(n / 1000) + 'K' : (n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n));\nconst TW = 740, TH = 620, TN = 48;\nconst THREADS = (() => {\n  const rnd = RANDOM(7771), out = [];\n  for (let i = 0; i < 30; i++) {\n    const y2 = 40 + i * (540 / 29), y1 = 20 + rnd() * 580, c1 = y1 + (rnd() - 0.5) * 330;\n    const pts = [];\n    for (let s = 0; s < 34; s++) {\n      const t = s / 33, m = 1 - t;\n      pts.push({\n        x: m * m * m * -30 + 3 * m * m * t * 230 + 3 * m * t * t * 350 + t * t * t * 450,\n        y: m * m * m * y1 + 3 * m * m * t * c1 + 3 * m * t * t * y2 + t * t * t * y2\n      });\n    }\n    for (let s = 1; s <= 14; s++) pts.push({ x: 450 + (320 / 14) * s, y: y2 });\n    const kind = i % 7 === 0 ? 2 : (i % 3 === 0 ? 1 : 0);\n    const pulses = [];\n    for (let q = 0; q < (i % 3 === 0 ? 2 : 1); q++) pulses.push({ off: rnd(), spd: 0.05 + rnd() * 0.075, len: 0.09 + rnd() * 0.13 });\n    out.push({ pts: pts, pulses: pulses,\n      col: kind === 2 ? '143,227,247' : (kind === 1 ? '43,179,224' : '20,56,74'),\n      pcol: kind === 2 ? '214,246,255' : (kind === 1 ? '176,236,255' : '109,206,238'),\n      w: kind === 2 ? 11 : (kind === 1 ? 10 : 12),\n      alpha: 0.55 + rnd() * 0.45,\n      freq: 1.5 + (i % 5) * 0.42 + rnd() * 0.3,\n      sway: 0.7 + rnd() * 1.6, phase: rnd() * 6.28,\n      amp: 0, t0: 0, u0: 0.5, drag: 0 });\n  }\n  return out;\n})();\n\nconst RK = [\n  ['FAD-4-LCDLE', 'FAD', 'A', 1, 0, 0, 12, 2], ['FAD-DETEP SMK 30-3013', 'FAD', 'A', 1, 0, 9.26, 34, 4],\n  ['FAD-DET-SIGA-IB', 'FAD', 'A', 1, 0, 0, 18, 3], ['FAD-MMDL-SIGA-CC1S', 'FAD', 'A', 1, 0, 24.75, 26, 6],\n  ['FAD-MMDL-SIGA-CT1', 'FAD', 'B', 1, 0, 80.81, 44, 12], ['FAD-MMDL-SIGA-CT2', 'FAD', 'B', 1, 0, 165.41, 52, 18],\n  ['FAD-MPS-WP-MPSR1-S45W-GE', 'FAD', 'A', 1, 0, 4.34, 16, 3], ['FAD-PAN-3-CAB21B', 'FAD', 'B', 0, 0, 0, 9, 2],\n  ['FAD-PAN-4-PPS/M', 'FAD', 'B', 0, 0, 1.3, 11, 3], ['FAD-PAN-MFC-A ENCLOSURE', 'FAD', 'A', 1, 0, 22.58, 30, 9],\n  ['FAD-RMDL-SIGA-CR', 'FAD', 'A', 1, 0, 27.5, 24, 6], ['FAD-SIGA-LED', 'FAD', 'C', 0, 0, 0, 7, 1],\n  ['FAD-STB-116DEGEX-FJ', 'FAD', 'B', 0, 0, 6.08, 14, 5], ['FAD-WEB-116EX-B', 'FAD', 'B', 0, 0, 6.08, 15, 5],\n  ['FAE-BCP-1\" BEAM CLAMP', 'FAE', 'C', 0, 0, 0, 6, 1], ['FAE-BCP-B441-22-PLTD', 'FAE', 'C', 0, 0, 0, 5, 1],\n  ['FAE-EMT-RIGID 3/4\" RED', 'FAE', 'B', 0, 0, 0, 22, 2], ['FAE-STL-3/4\" CONDUIT CLAMP', 'FAE', 'C', 0, 0, 0, 8, 2],\n  ['FAE-TBC-2\" THREADED BOX CONN', 'FAE', 'B', 0, -1, 151.83, 19, 1],\n  ['FAD-SIGA-CC1S MODULE', 'FAD', 'A', 1, 14, 11.4, 28, 8], ['FAE-EMT-1/2\" SET SCREW CPLG', 'FAE', 'C', 0, 240, 96.2, 60, 4],\n  ['FPS-VES-ASD-PIPE 25MM', 'FPS', 'A', 1, 6, 3.9, 40, 11], ['FPS-VES-ASD-ELBOW 25MM', 'FPS', 'B', 1, 18, 8.7, 36, 7],\n  ['FPS-VES-VLC-505 DETECTOR', 'FPS', 'A', 1, 2, 1.8, 10, 14], ['FPS-VES-SAMPLE POINT KIT', 'FPS', 'B', 0, 44, 31.5, 34, 5],\n  ['FPS-VES-CAP-END 25MM', 'FPS', 'C', 0, 310, 210.4, 55, 2], ['FSP-EXT-ABC 10LB', 'FSP', 'A', 1, 9, 6.2, 24, 10],\n  ['FSP-EXT-CO2 15LB', 'FSP', 'B', 1, 21, 17.9, 20, 6], ['FSP-EXT-BRACKET-WALL', 'FSP', 'C', 0, 140, 88.0, 40, 2],\n  ['FSP-BDA-ANT-DOME', 'FSP', 'A', 1, 3, 2.4, 12, 13], ['FSP-BDA-COAX-LMR400', 'FSP', 'B', 1, 60, 24.6, 48, 6],\n  ['FSP-BDA-SPLITTER-2WAY', 'FSP', 'C', 0, 88, 64.1, 26, 3]\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { mx: 1040, my: 400, cut: 30, dragCut: false, plucked: false, rFam: 'All', rTier: 'All', rCrit: 'All', rKey: 'risk', rDir: -1 };\n    this.held = -1;\n  }\n  tanglePoint(th, u) {\n    const i = Math.min(TN - 1, Math.max(0, Math.round(u * (th.pts.length - 1))));\n    return th.pts[i];\n  }\n  drawTangle(now) {\n    const cv = document.getElementById('tangle');\n    if (!cv) return;\n    const g = cv.getContext('2d');\n    g.setTransform(2, 0, 0, 2, 0, 0);\n    g.clearRect(0, 0, TW, TH);\n    g.lineCap = 'round';\n    g.lineJoin = 'round';\n    const t = now / 1000;\n    for (let i = 0; i < THREADS.length; i++) {\n      const th = THREADS[i], n = th.pts.length;\n      let disp = 0;\n      if (this.held === i) disp = th.drag;\n      else if (Math.abs(th.amp) > 0.3) {\n        const dt = (now - th.t0) / 1000;\n        disp = th.amp * Math.cos(6.2832 * th.freq * dt) * Math.exp(-dt / 1.15);\n        if (dt > 4) th.amp = 0;\n      }\n      const cur = new Array(n);\n      for (let s = 0; s < n; s++) {\n        const u = s / (n - 1), p = th.pts[s];\n        const hump = u <= th.u0 ? (th.u0 > 0 ? u / th.u0 : 0) : (th.u0 < 1 ? (1 - u) / (1 - th.u0) : 0);\n        const idle = Math.sin(t * 0.5 + th.phase + u * 2.4) * th.sway * Math.sin(Math.PI * u);\n        cur[s] = { x: p.x, y: p.y + disp * hump + idle };\n      }\n      g.beginPath();\n      for (let s = 0; s < n; s++) { if (s === 0) g.moveTo(cur[0].x, cur[0].y); else g.lineTo(cur[s].x, cur[s].y); }\n      g.strokeStyle = 'rgba(' + th.col + ',' + th.alpha.toFixed(2) + ')';\n      g.lineWidth = th.w;\n      g.stroke();\n      const at = (u) => {\n        const f = Math.max(0, Math.min(1, u)) * (n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), fr = f - i0;\n        return { x: cur[i0].x + (cur[i1].x - cur[i0].x) * fr, y: cur[i0].y + (cur[i1].y - cur[i0].y) * fr };\n      };\n      for (let q = 0; q < th.pulses.length; q++) {\n        const pl = th.pulses[q];\n        const head = ((t * pl.spd + pl.off) % 1.34) - 0.17;\n        if (head < -pl.len || head > 1.02) continue;\n        const segs = 7;\n        for (let sgi = 0; sgi < segs; sgi++) {\n          const u2 = head - pl.len * (sgi / segs), u1 = head - pl.len * ((sgi + 1) / segs);\n          if (u2 <= 0 || u1 >= 1) continue;\n          const a = at(u1), b = at(u2);\n          g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y);\n          g.strokeStyle = 'rgba(' + th.pcol + ',' + (0.92 * Math.pow(1 - sgi / segs, 1.5)).toFixed(3) + ')';\n          g.lineWidth = th.w * (0.62 - sgi * 0.04);\n          g.stroke();\n        }\n      }\n    }\n  }\n  hit(e) {\n    const cv = document.getElementById('tangle');\n    if (!cv) return null;\n    const b = cv.getBoundingClientRect();\n    const px = (e.clientX - b.left) * (TW / b.width), py = (e.clientY - b.top) * (TH / b.height);\n    if (px < 0 || px > TW || py < 0 || py > TH) return null;\n    let best = -1, bd = 26, bu = 0.5;\n    for (let i = 0; i < THREADS.length; i++) {\n      const pts = THREADS[i].pts;\n      for (let s = 0; s < pts.length; s++) {\n        if (Math.abs(pts[s].x - px) > 14) continue;\n        const d = Math.abs(pts[s].y - py);\n        if (d < bd) { bd = d; best = i; bu = s / (pts.length - 1); }\n      }\n    }\n    return best < 0 ? null : { i: best, u: bu, py: py };\n  }\n  setCut(e) {\n    const el = document.getElementById('curveCv');\n    if (!el) return;\n    const box = el.getBoundingClientRect();\n    if (!box.width) return;\n    const k = XRANK((e.clientX - box.left) * (CW / box.width));\n    this.setState({ cut: Math.max(1, Math.min(TOTAL, k)) });\n  }\n  drawCurve(now) {\n    const cv = document.getElementById('curveCv');\n    if (!cv) return;\n    const g = cv.getContext('2d');\n    g.setTransform(2, 0, 0, 2, 0, 0);\n    g.clearRect(0, 0, CW, CH);\n    const k = this.state.cut, t = now / 1000, cx = CX(k - 1);\n    g.font = '500 10px JetBrains Mono, monospace';\n    const plate = (txt, tx, ty, col, bg) => {\n      const w = g.measureText(txt).width;\n      g.fillStyle = bg || '#08131A';\n      g.fillRect(tx - 5, ty - 10, w + 10, 14);\n      g.fillStyle = col;\n      g.fillText(txt, tx, ty);\n      return w;\n    };\n\n    g.fillStyle = 'rgba(43,179,224,0.07)';\n    g.fillRect(PADL, PADT, cx - PADL, PH);\n\n    for (let p = 0; p <= 100; p += 25) {\n      const y = PADT + PH * (1 - p / 100);\n      g.beginPath(); g.moveTo(PADL, y); g.lineTo(PADL + PW, y);\n      g.strokeStyle = p === 0 ? 'rgba(228,237,242,0.22)' : 'rgba(228,237,242,0.08)';\n      g.lineWidth = 1; g.stroke();\n      g.fillStyle = 'rgba(228,237,242,0.5)';\n      g.fillText(p + '%', PADL + PW + 12, y + 3.5);\n    }\n\n    const dx0 = CX(MOVERS);\n    g.fillStyle = 'rgba(228,237,242,0.035)';\n    g.fillRect(dx0, PADT, PADL + PW - dx0, PH);\n\n    const bw = Math.max(1.15, PW / TOTAL - 0.55);\n    for (let i = 0; i < TOTAL; i++) {\n      const m = DATA.move[i], rel = m / DATA.max, kept = i < k;\n      const x = CX(i) - bw / 2;\n      if (m > 0) {\n        const h = Math.max(2, Math.pow(rel, 0.44) * PH * 0.94);\n        g.fillStyle = kept ? 'rgba(43,179,224,' + (0.5 + 0.5 * Math.pow(rel, 0.3)).toFixed(2) + ')' : 'rgba(228,237,242,0.2)';\n        g.fillRect(x, BASE - h, bw, h);\n      } else {\n        g.fillStyle = kept ? 'rgba(43,179,224,0.4)' : 'rgba(228,237,242,0.13)';\n        g.fillRect(x, BASE - 2, bw, 2);\n      }\n    }\n\n    g.beginPath();\n    g.moveTo(PADL, BASE);\n    for (let i = 0; i < TOTAL; i++) g.lineTo(CX(i), PADT + PH * (1 - DATA.cum[i] / DATA.total));\n    g.strokeStyle = 'rgba(228,237,242,0.9)';\n    g.lineWidth = 2; g.stroke();\n\n    const gi = Math.floor((((t * 0.11) % 1.35) - 0.18) * (TOTAL - 1));\n    if (gi >= 0 && gi < TOTAL) {\n      g.beginPath();\n      g.arc(CX(gi), PADT + PH * (1 - DATA.cum[gi] / DATA.total), 3, 0, 6.2832);\n      g.fillStyle = 'rgba(228,237,242,0.9)'; g.fill();\n    }\n\n    g.beginPath(); g.moveTo(PADL, BASE); g.lineTo(PADL, PADT);\n    g.strokeStyle = 'rgba(228,237,242,0.22)'; g.lineWidth = 1; g.stroke();\n    const ticks = [1, 30, 60, 150, 281, 400, 570];\n    for (let q = 0; q < ticks.length; q++) {\n      const tx = CX(ticks[q] - 1);\n      g.beginPath(); g.moveTo(tx, BASE); g.lineTo(tx, BASE + 5);\n      g.strokeStyle = 'rgba(228,237,242,0.22)'; g.lineWidth = 1; g.stroke();\n      const lab = String(ticks[q]);\n      g.fillStyle = Math.abs(tx - cx) < 26 ? 'rgba(228,237,242,0.25)' : 'rgba(228,237,242,0.5)';\n      g.fillText(lab, tx - g.measureText(lab).width / 2, BASE + 19);\n    }\n    g.fillStyle = 'rgba(127,148,161,0.9)';\n    g.fillText('ITEM RANK BY CONSUMPTION \\u2192', PADL, BASE + 36);\n    const rl = 'CUMULATIVE SHARE OF ALL CONSUMPTION';\n    g.fillText(rl, PADL + PW - g.measureText(rl).width, BASE + 36);\n\n    plate('TOP ITEM \\u00B7 ' + UNITS(DATA.move[0]) + ' UNITS', PADL + 8, PADT + 14, 'rgba(143,227,247,0.85)');\n    const dl = DEAD + ' ITEMS NEVER MOVED';\n    plate(dl, Math.min(PADL + PW - 8 - g.measureText(dl).width, dx0 + 10), BASE - 10, 'rgba(228,237,242,0.55)', 'rgba(8,19,26,0.85)');\n\n    g.beginPath(); g.moveTo(cx, PADT - 12); g.lineTo(cx, BASE + 6);\n    g.strokeStyle = '#8FE3F7'; g.lineWidth = 1.6; g.stroke();\n    g.beginPath(); g.moveTo(cx - 7, PADT - 14); g.lineTo(cx + 7, PADT - 14); g.lineTo(cx, PADT - 4);\n    g.fillStyle = '#8FE3F7'; g.fill();\n    const cyv = PADT + PH * (1 - DATA.cum[k - 1] / DATA.total);\n    g.beginPath(); g.arc(cx, cyv, 4, 0, 6.2832); g.fillStyle = '#8FE3F7'; g.fill();\n    const cl = 'RANK ' + k + ' \\u00B7 ' + (DATA.cum[k - 1] / DATA.total * 100).toFixed(1) + '% COVERED';\n    const clw = g.measureText(cl).width;\n    plate(cl, cx + clw + 20 < PADL + PW ? cx + 12 : cx - 12 - clw, Math.max(PADT + 12, Math.min(BASE - 6, cyv - 12)), '#8FE3F7', 'rgba(8,19,26,0.92)');\n  }\n  componentDidMount() {\n    this.move = (e) => {\n      this.setState({ mx: e.clientX, my: e.clientY });\n      if (this.state.dragCut) this.setCut(e);\n      if (this.held >= 0) {\n        const th = THREADS[this.held];\n        const cv = document.getElementById('tangle');\n        const b = cv.getBoundingClientRect();\n        const py = (e.clientY - b.top) * (TH / b.height);\n        th.drag = Math.max(-150, Math.min(150, py - this.tanglePoint(th, th.u0).y));\n      }\n    };\n    this.zclick = (e) => {\n      const zt = e.target && e.target.closest && e.target.closest('[data-zoom]');\n      if (!zt) return;\n      const zi = zt.tagName === 'IMG' ? zt : zt.querySelector('img');\n      this.setState({ zoom: (zi && (zi.currentSrc || zi.src)) || zt.getAttribute('data-zoom'), zoomCap: zt.getAttribute('data-cap') || '', zoomBig: false });\n      e.preventDefault(); e.stopPropagation();\n    };\n    this.esc = (e) => { if (e.key === 'Escape' && this.state.zoom) this.setState({ zoom: null, zoomBig: false }); };\n    document.addEventListener('click', this.zclick, true);\n    document.addEventListener('keydown', this.esc);\n    this.down = (e) => {\n      const h = this.hit(e);\n      if (!h) return;\n      const th = THREADS[h.i];\n      th.u0 = h.u; th.drag = 0; th.amp = 0;\n      this.held = h.i;\n      if (!this.state.plucked) this.setState({ plucked: true });\n      e.preventDefault();\n    };\n    this.up = () => {\n      if (this.state.dragCut) this.setState({ dragCut: false });\n      if (this.held >= 0) {\n        const th = THREADS[this.held];\n        th.amp = th.drag; th.t0 = performance.now(); th.drag = 0;\n        this.held = -1;\n      }\n    };\n    this.loop = (now) => { this.drawTangle(now); this.drawCurve(now); this.raf = requestAnimationFrame(this.loop); };\n    document.addEventListener('mousedown', this.down, true);\n    document.addEventListener('mousemove', this.move);\n    document.addEventListener('mouseup', this.up);\n    this.vis = () => { this.drawTangle(performance.now()); this.drawCurve(performance.now()); if (!document.hidden) { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(this.loop); } };\n    document.addEventListener('visibilitychange', this.vis);\n    this.drawTangle(performance.now());\n    this.drawCurve(performance.now());\n    this.raf = requestAnimationFrame(this.loop);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('mousedown', this.down, true);\n    document.removeEventListener('mousemove', this.move);\n    document.removeEventListener('mouseup', this.up);\n    document.removeEventListener('visibilitychange', this.vis);\n    document.removeEventListener('click', this.zclick, true);\n    document.removeEventListener('keydown', this.esc);\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const x = Math.round(this.state.mx), y = Math.round(this.state.my);\n    const k = this.state.cut;\n    const v = { pos: 'translate3d(' + x + 'px, ' + y + 'px, 0)',\n                posX: 'translate3d(' + x + 'px, 0, 0)',\n                posY: 'translate3d(0, ' + y + 'px, 0)',\n                readout: this.state.dragCut ? 'RANK ' + k + ' OF 570' : 'X ' + x + ' / Y ' + y,\n                hasZoom: !!this.state.zoom,\n                zoomCap: this.state.zoomCap || '',\n                zoomHint: this.state.zoomBig ? 'CLICK THE IMAGE TO FIT \\u00B7 CLOSE OR ESC TO GO BACK' : 'CLICK THE IMAGE TO ZOOM IN \\u00B7 CLOSE OR E
