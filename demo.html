one\"]\n};\n\n/* ── STATE ── */\nlet pickOrders=[], scanLog=[], poC=1, logC=1;\nlet isPhone=false, admUnlocked=false;\nlet activeOverlayTarget=null; // 'assign' or 'lookup'\nlet assignState={desc:null,mat:null,spec:null,size:null,item:null};\nlet lookupState={desc:null,mat:null,spec:null,size:null};\n\n/* ── HELPERS ── */\nconst $=id=>document.getElementById(id);\nconst getItem=bc=>inventory.find(i=>i.barcode===bc);\nconst nextPO=()=>`PO-${String(poC++).padStart(3,'0')}`;\nconst nextLog=()=>`LOG-${String(logC++).padStart(3,'0')}`;\n// Helper: format item description with both English and Chinese names\nfunction bilingual(desc){\n  if(!desc) return '';\n  const parts = desc.split('//');\n  const zh = parts[0]?.trim() || '';\n  const en = parts[1]?.trim() || '';\n  if(en && zh) return `${en} — ${zh}`;\n  return (en || zh || desc).trim();\n}\n// Compact version for tight spaces (English bold, Chinese muted small)\nfunction bilingualHTML(desc){\n  if(!desc) return '';\n  const parts = desc.split('//');\n  const zh = parts[0]?.trim() || '';\n  const en = parts[1]?.trim() || '';\n  if(en && zh) return `${en}<span style=\"color:var(--muted);font-weight:400;margin-left:4px;font-size:0.9em\">${zh}<\u002Fspan>`;\n  return (en || zh || desc).trim();\n}\n\nfunction now(){return new Date().toLocaleString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}\nfunction flash(id,msg,ms=3500){const e=$(id);e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),ms);}\nfunction popSel(id,arr){const s=$(id);s.innerHTML='<option value=\"\">— Select —<\u002Foption>';arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}\nfunction unique(arr){return [...new Set(arr.filter(Boolean).map(s=>s.trim()))].sort();}\n\n/* ── NAV ── */\nfunction nav(name){\n  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));\n  document.querySelectorAll('.top-tab,.pn-tab').forEach(t=>t.classList.remove('active'));\n  $(`screen-${name}`).classList.add('active');\n  $(`tt-${name}`)?.classList.add('active');\n  $(`pt-${name}`)?.classList.add('active');\n  if(name==='unload') setTimeout(()=>$('scanInput').focus(),80);\n  if(name==='debug'){refreshDbgInv();showDbg('inventory');}\n  if(name==='pick'){refreshPickDrop();refreshPickLog();}\n  if(name==='admin'){admRefresh();}\n}\n\n/* ── VIEW TOGGLE ── */\nfunction toggleView(){\n  isPhone=!isPhone;\n  document.body.classList.toggle('phone-mode',isPhone);\n  renderOrdersTable(); refreshPickLog(); refreshUnloadLog(); refreshDbgInv();\n}\n\n/* ── INIT ── */\nfunction init(){\n  $('a-date').valueAsDate=new Date();\n  popSel('a-assignedTo',settings.personnel);\n  popSel('p-by',settings.personnel);\n  popSel('u-by',settings.personnel);\n}\n\n/* ══════════════════════════════════════════════════════════\n   SEARCH OVERLAY\n   ══════════════════════════════════════════════════════════ */\nlet currentOverlayDesc=null;\n\nfunction openOverlay(target){\n  activeOverlayTarget=target;\n  $('sov-input').value='';\n  $('sov-list').innerHTML='<li class=\"sov-empty\">Start typing to search…<\u002Fli>';\n  $('searchOverlay').classList.add('open');\n  setTimeout(()=>$('sov-input').focus(),80);\n}\nfunction closeOverlay(){\n  $('searchOverlay').classList.remove('open');\n  activeOverlayTarget=null;\n}\n// Per-dropdown description caches (keyed by dropdownId)\nconst _inlineDescs = {};\n\nfunction inlineSearch(val, dropId, target){\n  const q = val.toLowerCase().trim();\n  const drop = $(dropId);\n  if(!q){ drop.classList.remove('open'); drop.innerHTML=''; return; }\n  const descs = unique(inventory.filter(i=>i.description.toLowerCase().includes(q)).map(i=>i.description));\n  _inlineDescs[dropId] = descs;\n  if(!descs.length){\n    drop.innerHTML='<div class=\"id-empty\">No results<\u002Fdiv>';\n    drop.classList.add('open');\n    return;\n  }\n  const pickFn = target==='unload' ? 'inlinePickUnload' : `inlinePick('${dropId}','${target}',`;\n  drop.innerHTML = descs.map((d,idx)=>{\n    const parts=d.split('//');\n    const zh=parts[0]?.trim()||'';\n    const en=parts[1]?.trim()||d;\n    const handler = target==='unload'\n      ? `onmousedown=\"inlinePickUnload(${idx})\"`\n      : `onmousedown=\"inlinePick('${dropId}','${target}',${idx})\"`;\n    return `<div class=\"id-item\" ${handler}><div class=\"id-en\">${en}<\u002Fdiv><div class=\"id-zh\">${zh}<\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n  drop.classList.add('open');\n}\n\nfunction hideInline(dropId){\n  const d=$(dropId); if(d){d.classList.remove('open');}\n}\n\nfunction inlinePick(dropId, target, idx){\n  const desc = _inlineDescs[dropId]?.[idx];\n  if(!desc) return;\n  hideInline(dropId);\n  if(target==='assign'){\n    aDescChosen(desc);\n  } else if(target==='lookup'){\n    lkDescChosen(desc);\n  }\n}\n\nfunction aOpenOverlay(){ openOverlay('assign'); }\nfunction lkOpenOverlay(){ openOverlay('lookup'); }\n\n// Shared desc results cache — avoids passing strings through HTML attributes\nlet _sovDescs = [];\n\nfunction sovFilter(val){\n  const q=val.toLowerCase().trim();\n  const ul=$('sov-list');\n  if(!q){ul.innerHTML='<li class=\"sov-empty\">Start typing to search\\u2026<\u002Fli>';_sovDescs=[];return;}\n  _sovDescs=unique(inventory.filter(i=>i.description.toLowerCase().includes(q)).map(i=>i.description));\n  if(!_sovDescs.length){ul.innerHTML='<li class=\"sov-empty\">No results for \"'+val+'\"<\u002Fli>';return;}\n  ul.innerHTML=_sovDescs.map((d,idx)=>{\n    const parts=d.split('//');\n    const zh=parts[0]?.trim()||'';\n    const en=parts[1]?.trim()||d;\n    return `<li class=\"sov-item\" onclick=\"sovPick(${idx})\"><div class=\"en\">${en}<\u002Fdiv><div class=\"zh\">${zh}<\u002Fdiv><\u002Fli>`;\n  }).join('');\n}\n\nfunction sovPick(idx){\n  const desc=_sovDescs[idx];\n  if(!desc) return;\n  closeOverlay();\n  if(activeOverlayTarget==='assign'){\n    hideInline('a-dropdown');\n    aDescChosen(desc);\n  } else {\n    hideInline('lk-dropdown');\n    lkDescChosen(desc);\n  }\n}\n\n/* ══════════════════════════════════════════════════════════\n   SHARED CASCADE SEARCH (inline dropdown for step 1)\n   ══════════════════════════════════════════════════════════ */\nfunction cascadeSearch(val, dropId, target){\n  inlineSearch(val, dropId, target);\n}\n\n/* ══════════════════════════════════════════════════════════\n   ASSIGN — 4-BAR CASCADE\n   ══════════════════════════════════════════════════════════ */\nfunction aDescChosen(desc){\n  assignState={desc,mat:null,spec:null,size:null,item:null};\n  const parts=desc.split('//');\n  $('a-searchInput').value=bilingual(desc);\n  hideInline('a-dropdown');\n\n  // Reset steps 2-4\n  aResetFrom(2);\n  $('a-step1-num').className='filter-step-num done';\n\n  // Hide result cards\n  $('a-itemCard').style.display='none';\n  $('a-formCard').style.display='none';\n\n  // Populate material step\n  const matches=inventory.filter(i=>i.description===desc);\n  const mats=unique(matches.map(i=>i.material).filter(Boolean));\n\n  if(!mats.length){\n    // No material at all — skip to spec\n    assignState.mat='';\n    $('a-step2-num').className='filter-step-num done';\n    aPopSpec();\n  } else if(mats.length===1){\n    // Only one material — auto-select, show as done\n    assignState.mat=mats[0];\n    const sel=$('a-matSel');\n    sel.innerHTML=`<option value=\"${mats[0]}\">${mats[0]}<\u002Foption>`;\n    sel.value=mats[0]; sel.disabled=false;\n    $('a-step2-num').className='filter-step-num done';\n    aPopSpec();\n  } else {\n    // Multiple — unlock and populate\n    const sel=$('a-matSel');\n    sel.innerHTML='<option value=\"\">— Select material —<\u002Foption>';\n    mats.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});\n    sel.value=''; sel.disabled=false;\n    $('a-step2-num').className='filter-step-num active';\n  }\n}\n\nfunction aCascadeMat(){\n  const v=$('a-matSel').value; if(!v) return;\n  assignState.mat=v; assignState.spec=null; assignState.size=null; assignState.item=null;\n  $('a-step2-num').className='filter-step-num done';\n  aResetFrom(3);\n  aPopSpec();\n}\n\nfunction aPopSpec(){\n  const {desc,mat}=assignState;\n  const matches=inventory.filter(i=>i.description===desc&&(mat===''||i.material===mat));\n  const specs=unique(matches.map(i=>i.specification).filter(Boolean));\n  const sel=$('a-specSel');\n\n  if(!specs.length){\n    assignState.spec='';\n    $('a-step3-num').className='filter-step-num done';\n    sel.innerHTML='<option value=\"\">N/A<\u002Foption>'; sel.disabled=true;\n    aPopSize();\n  } else if(specs.length===1){\n    assignState.spec=specs[0];\n    sel.innerHTML=`<option value=\"${specs[0]}\">${specs[0]}<\u002Foption>`;\n    sel.value=specs[0]; sel.disabled=false;\n    $('a-step3-num').className='filter-step-num done';\n    aPopSize();\n  } else {\n    sel.innerHTML='<option value=\"\">— Select specification —<\u002Foption>';\n    specs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});\n    sel.value=''; sel.disabled=false;\n    $('a-step3-num').className='filter-step-num active';\n  }\n}\n\nfunction aCascadeSpec(){\n  const v=$('a-specSel').value; if(!v) return;\n  assignState.spec=v; assignState.size=null; assignState.item=null;\n  $('a-step3-num').className='filter-step-num done';\n  aResetFrom(4);\n  aPopSize();\n}\n\nfunction aPopSize(){\n  const {desc,mat,spec}=assignState;\n  const matches=inventory.filter(i=>\n    i.description===desc&&(mat===''||i.material===mat)&&(spec===''||i.specification===spec));\n  const sizes=unique(matches.map(i=>i.size).filter(Boolean));\n  const sel=$('a-sizeSel');\n\n  if(!sizes.length){\n    assignState.size='';\n    $('a-step4-num').className='filter-step-num done';\n    sel.innerHTML='<option value=\"\">N/A<\u002Foption>'; sel.disabled=true;\n    aFinalise(matches[0]);\n  } else if(sizes.length===1){\n    assignState.size=sizes[0];\n    sel.innerHTML=`<option value=\"${sizes[0]}\">${sizes[0]}<\u002Foption>`;\n    sel.value=sizes[0]; sel.disabled=false;\n    $('a-step4-num').className='filter-step-num done';\n    aFinalise(matches[0]);\n  } else {\n    sel.innerHTML='<option value=\"\">— Select size —<\u002Foption>';\n    sizes.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});\n    sel.value=''; sel.disabled=false;\n    $('a-step4-num').className='filter-step-num active';\n  }\n}\n\nfunction aCascadeSize(){\n  const v=$('a-sizeSel').value; if(!v) return;\n  assignState.size=v;\n  $('a-step4-num').className='filter-step-num done';\n  const {desc,mat,spec}=assignState;\n  const item=inventory.find(i=>\n    i.description===desc&&(mat===''||i.material===mat)&&(spec===''||i.specification===spec)&&i.size===v);\n  aFinalise(item);\n}\n\nfunction aResetFrom(step){\n  if(step<=2){\n    assignState.mat=null;\n    const s=$('a-matSel'); s.innerHTML='<option value=\"\">— Select item first —<\u002Foption>'; s.disabled=true;\n    $('a-step2-num').className='filter-step-num';\n  }\n  if(step<=3){\n    assignState.spec=null;\n    const s=$('a-specSel'); s.innerHTML='<option value=\"\">— Select material first —<\u002Foption>'; s.disabled=true;\n    $('a-step3-num').className='filter-step-num';\n  }\n  if(step<=4){\n    assignState.size=null;\n    const s=$('a-sizeSel'); s.innerHTML='<option value=\"\">— Select specification first —<\u002Foption>'; s.disabled=true;\n    $('a-step4-num').className='filter-step-num';\n  }\n  assignState.item=null;\n  $('a-itemCard').style.display='none';\n  $('a-formCard').style.display='none';\n}\n\nfunction aFinalise(item){\n  if(!item) return;\n  assignState.item=item;\n  $('a-barcode').textContent=item.barcode;\n  $('a-material').textContent=item.material||'—';\n  $('a-spec').textContent=item.specification||'—';\n  $('a-size').textContent=item.size||'—';\n  $('a-location').textContent=item.location;\n  $('a-stock').textContent=item.stock;\n  $('a-itemCard').style.display='block';\n  $('a-formCard').style.display='block';\n}\n\nfunction aClear(){\n  assignState={desc:null,mat:null,spec:null,size:null,item:null};\n  $('a-searchInput').value='';\n  hideInline('a-dropdown');\n  aResetFrom(2);\n  $('a-step1-num').className='filter-step-num active';\n  $('a-qty').value=1;\n}\n\nfunction createOrder(){\n  const item=assignState.item;\n  const qty=parseInt($('a-qty').value);\n  const to=$('a-assignedTo').value;\n  if(!item){flash('a-err','Please select an item first.');return;}\n  if(!qty||qty<1){flash('a-err','Enter a valid quantity.');return;}\n  const order={\n    OrderID:nextPO(), CreatedBy:'Warehouse Lead', AssignedDate:$('a-date').value,\n    DueDate:$('a-date').value, Barcode:item.barcode, ItemName:item.description,\n    Material:item.material, Specification:item.specification, Size:item.size,\n    Location:item.location, QtyRequested:qty, AssignedTo:to,\n    Status:'Open', QtyActualPicked:0, CompletedDate:'', Notes:''\n  };\n  pickOrders.push(order);\n  renderOrdersTable();\n  flash('a-ok',`Order ${order.OrderID} created — ${bilingual(item.description)} for ${to}`);\n  aClear();\n  // SharePoint sync\n  apiAddPickOrder(order);\n}\n\nfunction renderOrdersTable(){\n  // desktop\n  const tb=$('ordersBody');\n  tb.innerHTML=!pickOrders.length?'<tr><td colspan=\"9\"><div class=\"empty\">No orders yet<\u002Fdiv><\u002Ftd><\u002Ftr>':\n    pickOrders.map(o=>`<tr>\n      <td class=\"mono\">${o.OrderID}<\u002Ftd>\n      <td class=\"mono\" style=\"font-size:11px\">${o.Barcode}<\u002Ftd>\n      <td style=\"max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" title=\"${o.ItemName}\">${bilingualHTML(o.ItemName)}<\u002Ftd>\n      <td>${o.Material}<\u002Ftd><td>${o.Specification}<\u002Ftd><td>${o.Size}<\u002Ftd>\n      <td class=\"mono\">${o.QtyRequested}<\u002Ftd><td>${o.AssignedTo}<\u002Ftd>\n      <td><span class=\"badge ${o.Status==='Open'?'b-open':'b-done'}\">${o.Status}<\u002Fspan><\u002Ftd>\n    <\u002Ftr>`).join('');\n  // phone\n  const pl=$('ordersPL');\n  pl.innerHTML=!pickOrders.length?'<div class=\"empty\">No orders yet<\u002Fdiv>':\n    pickOrders.map(o=>`<div class=\"pcard\">\n      <div class=\"pcard-title\">${bilingualHTML(o.ItemName)}<span class=\"badge ${o.Status==='Open'?'b-open':'b-done'}\" style=\"float:right;font-size:10px\">${o.Status}<\u002Fspan><\u002Fdiv>\n      <div class=\"pcard-row\"><span class=\"pcard-lbl\">Order<\u002Fspan><span class=\"pcard-val\">${o.OrderID}<\u002Fspan><\u002Fdiv>\n      <div class=\"pcard-row\"><span class=\"pcard-lbl\">Barcode<\u002Fspan><span class=\"pcard-val\">${o.Barcode}<\u002Fspan><\u002Fdiv>\n      <div class=\"pcard-row\"><span class=\"pcard-lbl\">Mat / Spec / Size<\u002Fspan><span class=\"pcard-val\">${o.Material} ${o.Specification} ${o.Size}<\u002Fspan><\u002Fdiv>\n      <div class=\"pcard-row\"><span class=\"pcard-lbl\">Qty<\u002Fspan><span class=\"pcard-val\">${o.QtyRequested}<\u002Fspan><\u002Fdiv>\n      <div class=\"pcard-row\"><span class=\"pcard-lbl\">Assigned To<\u002Fspan><span class=\"pcard-val\">${o.AssignedTo}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n/* ══════════════════════════════════════════════════════════\n   PICK\n   ══════════════════════════════════════════════════════════ */\nfunction refreshPickDrop(){\n  const sel=$('p-sel'), open=pickOrders.filter(o=>o.Status==='Open');\n  sel.innerHTML='<option value=\"\">— Select an open order —<\u002Foption>';\n  open.forEach(o=>{const opt=document.createElement('option');opt.value=o.OrderID;opt.textContent=`${o.OrderID} — ${bilingual(o.ItemName)} → ${o.AssignedTo}`;sel.appendChild(opt);});\n  $('p-detail').style.display='none';\n}\n\nfunction pickSelect(){\n  const oid=$('p-sel').value; if(!oid){$('p-detail').style.display='none';return;}\n  const order=pickOrders.find(o=>o.OrderID===oid);\n  const item=getItem(order.Barcode);\n  if(!order||!item) return;\n  $('p-oid').textContent=order.OrderID;\n  $('p-who').textContent=order.AssignedTo;\n  $('p-desc').textContent=bilingual(item.description);\n  $('p-mat').textContent=item.material||'—';\n  $('p-spec').textContent=item.specification||'—';\n  $('p-sz').textContent=item.size||'—';\n  $('p-loc').textContent=item.location;\n  $('p-stk').textContent=item.stock;\n  $('p-qreq').textContent=order.QtyRequested;\n  $('p-qpick').value=order.QtyRequested;\n  const sel=$('p-by');\n  for(let i=0;i<sel.options.length;i++) if(sel.options[i].value===order.AssignedTo){sel.selectedIndex=i;break;}\n  $('p-detail').style.display='block';\n}\n\nfunction completePick(){\n  const oid=$('p-sel').value;\n  const order=pickOrders.find(o=>o.OrderID===oid);\n  const item=getItem(order.Barcode);\n  const qty=parseInt($('p-qpick').value);\n  const by=$('p-by').value;\n  if(!qty||qty<0){flash('p-err','Enter valid qty.');return;}\n  const before=item.stock;\n  order.Status='Completed'; order.QtyActualPicked=qty; order.CompletedDate=now();\n  item.stock=Math.max(0,item.stock-qty);\n  const _picklog = {LogID:nextLog(),Timestamp:now(),Barcode:order.Barcode,ItemName:item.description,Location:item.location,StockBefore:before,QtyChanged:-qty,StockAfter:item.stock,ScannedBy:by,Action:'Pick',LinkedOrderID:order.OrderID,Notes:''};\n  scanLog.unshift(_picklog);\n  flash('p-ok',`Pick complete — ${qty}x ${bilingual(item.description)}. Stock now: ${item.stock}`);\n  // SharePoint sync (fire and forget — errors shown in sync bar)\n  apiUpdateStock(item);\n  apiUpdatePickOrder(order);\n  apiAddScanLog(_picklog);\n  refreshPickDrop(); refreshPickLog(); renderOrdersTable(); admRefreshLog();\n}\n\nfunction refreshPickLog(){\n  const rows=scanLog.filter(l=>l.Action==='Pick').slice(0,15);\n  $('pickLogBody').innerHTML=!rows.length?'<tr><td colspan=\"7\"><div class=\"empty\">No picks yet<\u002Fdiv><\u002Ftd><\u002Ftr>':\n    rows.map(l=>`<tr><td class=\"mono\">${l.LogID}<\u002Ftd><td class=\"mono\" style=\"font-size:11px\">${l.Timestamp}<\u002Ftd><td class=\"mono\">${l.Barcode}<\u002Ftd><td>${bilingualHTML(l.ItemName)}<\u002Ftd><td class=\"mono\">${Math.abs(l.QtyChanged)}<\u002Ftd><td>${l.ScannedBy}<\u002Ftd><td class=\"mono\">${l.LinkedOrderID||'—'}<\u002Ftd><\u002Ftr>`).join('');\n  $('pickLogPL').innerHTML=!rows.length?'<div class=\"empty\">No picks yet<\u002Fdiv>':\n    rows.map(l=>`<div class=\"pcard\"><div class=\"pcard-title\">${bilingualHTML(l.ItemName)}<span class=\"badge b-pick\" style=\"float:right;font-size:10px\">Pick<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">Log<\u002Fspan><span class=\"pcard-val\">${l.LogID}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">Time<\u002Fspan><span class=\"pcard-val\" style=\"font-size:11px\">${l.Timestamp}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">Qty<\u002Fspan><span class=\"pcard-val\">${Math.abs(l.QtyChanged)}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">By<\u002Fspan><span class=\"pcard-val\">${l.ScannedBy}<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join('');\n}\n\n/* ══════════════════════════════════════════════════════════\n   UNLOAD\n   ══════════════════════════════════════════════════════════ */\n$('scanInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();hideInline('u-dropdown');doScan();}});\n\n// Per-dropdown desc cache for unload\n_inlineDescs['u-dropdown'] = [];\n\nfunction unloadInputHandler(val){\n  // If value looks like a barcode (no spaces, mostly digits/alphanumeric) don't show dropdown\n  const looksLikeBarcode = /^[A-Za-z0-9\\-]+$/.test(val.trim()) && val.trim().length >= 6 && !/\\s/.test(val);\n  if(looksLikeBarcode){ hideInline('u-dropdown'); return; }\n  // Otherwise treat as description search\n  inlineSearch(val, 'u-dropdown', 'unload');\n}\n\nfunction inlinePickUnload(idx){\n  const descs = _inlineDescs['u-dropdown'];\n  const desc = descs?.[idx];\n  if(!desc) return;\n  hideInline('u-dropdown');\n  // Find first item matching this description and show it\n  const item = inventory.find(i=>i.description===desc);\n  if(!item) return;\n  $('scanInput').value = item.barcode;\n  // Reuse existing scan display logic\n  $('u-detail').style.display='none'; $('u-notfound').style.display='none';\n  $('u-desc').textContent=bilingual(item.description);\n  $('u-loc').textContent=item.location;\n  $('u-stk').textContent=item.stock;\n  $('u-bc').textContent=item.barcode;\n  $('u-qty').value=1;\n  const pct=Math.min(100,Math.round(item.stock/5));\n  const bar=$('u-sbar'); bar.style.width=pct+'%';\n  bar.className='sbar-fill'+(item.stock<10?' low':'');\n  $('u-detail').style.display='block'; $('u-qty').focus();\n}\n\nfunction doScan(){\n  const bc=$('scanInput').value.trim(); if(!bc) return;\n  const item=getItem(bc);\n  $('u-detail').style.display='none'; $('u-notfound').style.display='none';\n  if(!item){$('u-nfmsg').textContent=`Barcode \"${bc}\" not found in inventory.`;$('u-notfound').style.display='block';return;}\n  $('u-desc').textContent=bilingual(item.description);\n  $('u-loc').textContent=item.location;\n  $('u-stk').textContent=item.stock;\n  $('u-bc').textContent=bc;\n  $('u-qty').value=1;\n  const pct=Math.min(100,Math.round(item.stock/5));\n  const bar=$('u-sbar'); bar.style.width=pct+'%';\n  bar.className='sbar-fill'+(item.stock<10?' low':'');\n  $('u-detail').style.display='block'; $('u-qty').focus();\n}\n\nfunction confirmUnload(){\n  const bc=$('u-bc').textContent, item=getItem(bc);\n  const qty=parseInt($('u-qty').value), by=$('u-by').value;\n  if(!item){flash('u-err','Item not found.');return;}\n  if(!qty||qty<1){flash('u-err','Enter valid qty received.');return;}\n  const before=item.stock;\n  item.stock+=qty;\n  const _inbound = {LogID:nextLog(),Timestamp:now(),Barcode:bc,ItemName:item.description,Location:item.location,StockBefore:before,QtyChanged:qty,StockAfter:item.stock,ScannedBy:by,Action:'Inbound',LinkedOrderID:'',Notes:''};\n  scanLog.unshift(_inbound);\n  flash('u-ok',`${qty}x ${bilingual(item.description)} received. New stock: ${item.stock}`);\n  // SharePoint sync\n  apiUpdateStock(item);\n  apiAddScanLog(_inbound);\n  refreshUnloadLog(); admRefreshLog();\n  $('scanInput').value=''; $('u-detail').style.display='none';\n  setTimeout(()=>$('scanInput').focus(),150);\n}\n\nfunction cancelScan(){\n  $('scanInput').value=''; $('u-detail').style.display='none'; $('u-notfound').style.display='none';\n  $('scanInput').focus();\n}\n\nfunction refreshUnloadLog(){\n  const rows=scanLog.filter(l=>l.Action==='Inbound').slice(0,15);\n  $('unloadLogBody').innerHTML=!rows.length?'<tr><td colspan=\"7\"><div class=\"empty\">No inbound yet<\u002Fdiv><\u002Ftd><\u002Ftr>':\n    rows.map(l=>`<tr><td class=\"mono\">${l.LogID}<\u002Ftd><td class=\"mono\" style=\"font-size:11px\">${l.Timestamp}<\u002Ftd><td class=\"mono\">${l.Barcode}<\u002Ftd><td>${bilingualHTML(l.ItemName)}<\u002Ftd><td class=\"mono\">+${l.QtyChanged}<\u002Ftd><td class=\"mono\">${l.StockAfter}<\u002Ftd><td>${l.ScannedBy}<\u002Ftd><\u002Ftr>`).join('');\n  $('unloadLogPL').innerHTML=!rows.length?'<div class=\"empty\">No inbound yet<\u002Fdiv>':\n    rows.map(l=>`<div class=\"pcard\"><div class=\"pcard-title\">${bilingualHTML(l.ItemName)}<span class=\"badge b-in\" style=\"float:right;font-size:10px\">Inbound<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">Qty In<\u002Fspan><span class=\"pcard-val\">+${l.QtyChanged}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">New Stock<\u002Fspan><span class=\"pcard-val\">${l.StockAfter}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">Time<\u002Fspan><span class=\"pcard-val\" style=\"font-size:11px\">${l.Timestamp}<\u002Fspan><\u002Fdiv><div class=\"pcard-row\"><span class=\"pcard-lbl\">By<\u002Fspan><span class=\"pcard-val\">${l.ScannedBy}<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join('');\n}\n\n/* ══════════════════════════════════════════════════════════\n   LOOKUP — 4-BAR CASCADE\n   ══════════════════════════════════════════════════════════ */\n\nfunction lkDescChosen(desc){\n  lookupState={desc,mat:null,spec:null,size:null};\n  const parts=desc.split('//');\n  $('lk-input').value=bilingual(desc);\n  hideInline('lk-dropdown');\n  $('lk-resultCard').style.display='none';\n\n  lkResetFrom(2);\n  $('lk-step1-num').className='filter-step-num done';\n\n  const matches=inventory.filter(i=>i.description===desc);\n  const mats=unique(matches.map(i=>i.material).filter(Boolean));\n\n  if(!mats.length){\n    lookupState.mat='';\n    $('lk-step2-num').className='filter-step-num done';\n    const s=$('lk-matSel'); s.innerHTML='<option value=\"\">N/A<\u002Foption>'; s.disabled=true;\n    lkPopSpec();\n  } else if(mats.length===1){\n    lookupState.mat=mats[0];\n    const s=$('lk-matSel'); s.innerHTML=`<option value=\"${mats[0]}\">${mats[0]}<\u002Foption>`; s.value=mats[0]; s.disabled=false;\n    $('lk-step2-num').className='filter-step-num done';\n    lkPopSpec();\n  } else {\n    const s=$('lk-matSel'); s.innerHTML='<option value=\"\">— Select material —<\u002Foption>';\n    mats.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;s.appendChild(o);});\n    s.value=''; s.disabled=false;\n    $('lk-step2-num').className='filter-step-num active';\n  }\n}\n\nfunction lkCascadeMat(){\n  const v=$('lk-matSel').value; if(!v) return;\n  lookupState.mat=v; lookupState.spec=null; lookupState.size=null;\n  $('lk-step2-num').className='filter-step-num done';\n  lkResetFrom(3);\n  lkPopSpec();\n}\n\nfunction lkPopSpec(){\n  const {desc,mat}=lookupState;\n  const matches=inventory.filter(i=>i.description===desc&&(mat===''||i.material===mat));\n  const specs=unique(matches.map(i=>i.specification).filter(Boolean));\n  const s=$('lk-specSel');\n\n  if(!specs.length){\n    lookupState.spec='';\n    $('lk-step3-num').className='filter-step-num done';\n    s.innerHTML='<option value=\"\">N/A<\u002Foption>'; s.disabled=true;\n    lkPopSize();\n  } else if(specs.length===1){\n    lookupState.spec=specs[0];\n    s.innerHTML=`<option value=\"${specs[0]}\">${specs[0]}<\u002Foption>`; s.value=specs[0]; s.disabled=false;\n    $('lk-step3-num').className='filter-step-num done';\n    lkPopSize();\n  } else {\n    s.innerHTML='<option value=\"\">— Select specification —<\u002Foption>';\n    specs.forEach(sp=>{const o=document.createElement('option');o.value=sp;o.textContent=sp;s.appendChild(o);});\n    s.value=''; s.disabled=false;\n    $('lk-step3-num').className='filter-step-num active';\n  }\n}\n\nfunction lkCascadeSpec(){\n  const v=$('lk-specSel').value; if(!v) return;\n  lookupState.spec=v; lookupState.size=null;\n  $('lk-step3-num').className='filter-step-num done';\n  lkResetFrom(4);\n  lkPopSize();\n}\n\nfunction lkPopSize(){\n  const {desc,mat,spec}=lookupState;\n  const matches=inventory.filter(i=>\n    i.description===desc&&(mat===''||i.material===mat)&&(spec===''||i.specification===spec));\n  const sizes=unique(matches.map(i=>i.size).filter(Boolean));\n  const s=$('lk-sizeSel');\n\n  if(!sizes.length){\n    lookupState.size='';\n    $('lk-step4-num').className='filter-step-num done';\n    s.innerHTML='<option value=\"\">N/A<\u002Foption>'; s.disabled=true;\n    lkFinalise(matches[0]);\n  } else if(sizes.length===1){\n    lookupState.size=sizes[0];\n    s.innerHTML=`<option value=\"${sizes[0]}\">${sizes[0]}<\u002Foption>`; s.value=sizes[0]; s.disabled=false;\n    $('lk-step4-num').className='filter-step-num done';\n    lkFinalise(matches[0]);\n  } else {\n    s.innerHTML='<option value=\"\">— Select size —<\u002Foption>';\n    sizes.forEach(sz=>{const o=document.createElement('option');o.value=sz;o.textContent=sz;s.appendChild(o);});\n    s.value=''; s.disabled=false;\n    $('lk-step4-num').className='filter-step-num active';\n  }\n}\n\nfunction lkCascadeSize(){\n  const v=$('lk-sizeSel').value; if(!v) return;\n  lookupState.size=v;\n  $('lk-step4-num').className='filter-step-num done';\n  const {desc,mat,spec}=lookupState;\n  const item=inventory.find(i=>\n    i.description===desc&&(mat===''||i.material===mat)&&(spec===''||i.specification===spec)&&i.size===v);\n  lkFinalise(item);\n}\n\nfunction lkResetFrom(step){\n  if(step<=2){\n    lookupState.mat=null;\n    const s=$('lk-matSel'); s.innerHTML='<option value=\"\">— Select item first —<\u002Foption>'; s.disabled=true;\n    $('lk-step2-num').className='filter-step-num';\n  }\n  if(step<=3){\n    lookupState.spec=null;\n    const s=$('lk-specSel'); s.innerHTML='<option value=\"\">— Select material first —<\u002Foption>'; s.disabled=true;\n    $('lk-step3-num').className='filter-step-num';\n  }\n  if(step<=4){\n    lookupState.size=null;\n    const s=$('lk-sizeSel'); s.innerHTML='<option value=\"\">— Select specification first —<\u002Foption>'; s.disabled=true;\n    $('lk-step4-num').className='filter-step-num';\n  }\n  $('lk-resultCard').style.display='none';\n}\n\nfunction lkFinalise(item){\n  if(!item) return;\n  $('lk-desc').textContent=bilingual(item.description);\n  $('lk-mat').textContent=item.material||'—';\n  $('lk-spec').textContent=item.specification||'—';\n  $('lk-size').textContent=item.size||'—';\n  $('lk-bc').textContent=item.barcode;\n  $('lk-loc').textContent=item.location;\n  const stk=$('lk-stk');\n  stk.textContent=item.stock;\n  stk.className='stock-big'+(item.stock<10?' low':'');\n  $('lk-resultCard').style.display='block';\n}\n\n/* ══════════════════════════════════════════════════════════\n   DEBUG\n   ══════════════════════════════════════════════════════════ */\nlet dbgKey='inventory';\nfunction showDbg(key){\n  dbgKey=key;\n  const data=key==='inventory'?inventory:key==='orders'?pickOrders:scanLog;\n  $('dbgLabel').textContent=key==='inventory'?'Inventory':key==='orders'?'Pick Orders':'Scan Log';\n  $('dbgPre').textContent=JSON.stringify(data,null,2);\n}\nfunction copyDbg(){\n  const data=dbgKey==='inventory'?inventory:dbgKey==='orders'?pickOrders:scanLog;\n  navigator.clipboard.writeText(JSON.stringify(data,null,2)).then(()=>alert('JSON copied!')).catch(()=>alert('Copy failed — select and copy manually.'));\n}\nfunction refreshDbgInv(){\n  $('dbgInvBody').innerHTML=inventory.map(i=>`<tr><td class=\"mono\" style=\"font-size:11px\">${i.barcode}<\u002Ftd><td style=\"font-size:12px\">${bilingualHTML(i.description)}<\u002Ftd><td>${i.material}<\u002Ftd><td>${i.specification}<\u002Ftd><td>${i.size}<\u002Ftd><td class=\"mono\">${i.stock}<\u002Ftd><td>${i.location}<\u002Ftd><\u002Ftr>`).join('');\n}\n\n/* ══════════════════════════════════════════════════════════\n   ADMIN\n   ══════════════════════════════════════════════════════════ */\nasync function admLogin(){\n  const pw=$('adm-pw').value;\n  const hash=await sha256(pw);\n  if(hash===ADMIN_HASH){\n    admUnlocked=true;\n    $('adminLock').style.display='none';\n    $('adminContent').style.display='block';\n    admRefresh();\n  } else {\n    flash('adm-err','Incorrect password.');\n    $('adm-pw').value='';\n  }\n}\n\nfunction admLogout(){\n  admUnlocked=false;\n  $('adminContent').style.display='none';\n  $('adminLock').style.display='block';\n  $('adm-pw').value='';\n}\n\nfunction admRefresh(){\n  if(!admUnlocked) return;\n  $('adm-personnel').value=settings.personnel.join('\\n');\n  $('adm-projects').value=settings.projects.join('\\n');\n  $('adm-locations').value=settings.locations.join('\\n');\n  admRefreshLog();\n}\n\nfunction admRefreshLog(){\n  if(!admUnlocked) return;\n  const tb=$('adm-logBody');\n  tb.innerHTML=!scanLog.length?'<tr><td colspan=\"10\"><div class=\"empty\">No scan log yet<\u002Fdiv><\u002Ftd><\u002Ftr>':\n    scanLog.map(l=>`<tr><td class=\"mono\">${l.LogID}<\u002Ftd><td class=\"mono\" style=\"font-size:11px\">${l.Timestamp}<\u002Ftd><td><span class=\"badge ${l.Action==='Pick'?'b-pick':'b-in'}\">${l.Action}<\u002Fspan><\u002Ftd><td class=\"mono\" style=\"font-size:11px\">${l.Barcode}<\u002Ftd><td style=\"font-size:12px\">${bilingualHTML(l.ItemName)}<\u002Ftd><td class=\"mono\">${l.StockBefore}<\u002Ftd><td class=\"mono\">${l.QtyChanged}<\u002Ftd><td class=\"mono\">${l.StockAfter}<\u002Ftd><td>${l.ScannedBy}<\u002Ftd><td class=\"mono\">${l.LinkedOrderID||'—'}<\u002Ftd><\u002Ftr>`).join('');\n}\n\nfunction admSavePersonnel(){\n  settings.personnel=$('adm-personnel').value.split('\\n').map(s=>s.trim()).filter(Boolean);\n  popSel('a-assignedTo',settings.personnel);\n  popSel('p-by',settings.personnel);\n  popSel('u-by',settings.personnel);\n  flash('adm-ok','Personnel list saved.');\n}\nfunction admSaveProjects(){ settings.projects=$('adm-projects').value.split('\\n').map(s=>s.trim()).filter(Boolean); flash('adm-ok','Projects list saved.'); }\nfunction admSaveLocations(){ settings.locations=$('adm-locations').value.split('\\n').map(s=>s.trim()).filter(Boolean); flash('adm-ok','Locations list saved.'); }\n\nfunction lkSearch(v){ inlineSearch(v,'lk-dropdown','lookup'); }\n\n// Close inline dropdowns when clicking outside\ndocument.addEventListener('click', e=>{\n  ['a-dropdown','lk-dropdown','u-dropdown'].forEach(id=>{\n    const drop=$(id);\n    if(drop && !drop.contains(e.target)){\n      const inp = id==='a-dropdown' ? $('a-searchInput') : id==='lk-dropdown' ? $('lk-input') : $('scanInput');\n      if(inp && !inp.contains(e.target)) hideInline(id);\n    }\n  });\n});\n\n/* ── BOOT ── */\ninit();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
